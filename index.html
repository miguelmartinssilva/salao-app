<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" id="theme-color" content="#1a0a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="data:application/json,{}" id="manifest-link">
<title>Studio Glamour</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--gold:#c9a84c;--gold-light:#e8c97a;--dark:#1a0a14;--dark2:#2d1020;--rose:#fdf8f4;--rose2:#fdf0e8;--text:#9b7060;--green:#7dc9a0;--red:#c97a7a;--pink:#e0a0c0;--bg:#fdf8f4;--card:#fff;--card-border:#fdf0e8;--input-bg:#fdf8f4;--shadow:rgba(180,100,120,.08);--text-primary:#1a0a14;--text-secondary:#2d1020}
.dark{--dark:#e8dcd4;--dark2:#d4c8c0;--rose:#1a0a14;--rose2:#2d1020;--text:#a09088;--bg:#0d060e;--card:#1a0a14;--card-border:#2d1020;--input-bg:#2d1020;--shadow:rgba(0,0,0,.3);--text-primary:#e8dcd4;--text-secondary:#d4c8c0}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text-primary);overflow-x:hidden;transition:background .3s,color .3s}
input,select,button,textarea{font-family:inherit;font-size:inherit}
.header{background:linear-gradient(160deg,var(--dark),var(--dark2));padding:12px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.25)}
.header-brand{display:flex;align-items:center;gap:8px}
.header-logo{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-light));display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.header-title{color:var(--gold);font-size:14px;font-weight:700;font-style:italic}
.header-actions{display:flex;gap:6px;align-items:center}
.header-btn{background:linear-gradient(135deg,var(--gold),var(--gold-light));border:none;border-radius:8px;color:var(--dark);padding:7px 12px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap}
.icon-btn{background:none;border:none;cursor:pointer;color:rgba(255,220,200,.6);padding:6px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.icon-btn:hover{color:var(--gold)}
.tabbar{display:flex;background:var(--card);padding:5px 4px;position:sticky;top:56px;z-index:99;box-shadow:0 1px 8px var(--shadow);justify-content:space-around;transition:background .3s}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 8px;border-radius:8px;border:none;cursor:pointer;background:transparent;color:var(--text);font-size:9px;font-weight:600;width:100%;transition:all .2s}
.tabbar .active{background:linear-gradient(135deg,#c9a84c22,#c9a84c11);color:var(--gold)}
.tabbar svg{width:20px;height:20px}
.main{padding:12px 12px 80px;max-width:500px;margin:0 auto}
.page-title{font-size:18px;color:var(--text-primary);font-weight:400;margin-bottom:12px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.kpi-card{background:var(--card);border-radius:12px;padding:12px;box-shadow:0 1px 8px var(--shadow);border-top:3px solid var(--gold);transition:background .3s}
.kpi-label{color:var(--text);font-size:9px;text-transform:uppercase;margin-bottom:3px;font-weight:600;letter-spacing:.3px}
.kpi-value{font-size:18px;font-weight:700;color:var(--text-primary)}
.card{background:var(--card);border-radius:12px;padding:14px;box-shadow:0 1px 8px var(--shadow);margin-bottom:12px;transition:background .3s}
.card-title{font-size:14px;font-weight:600;color:var(--text-primary);margin-bottom:10px}
.appt-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--card-border);transition:border-color .3s}
.appt-item:last-child{border-bottom:none}
.appt-time{width:44px;text-align:center;flex-shrink:0}
.appt-time .t{font-size:13px;font-weight:700;color:var(--text-primary)}
.appt-info{flex:1;min-width:0}
.appt-info .name{font-size:12px;font-weight:600;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appt-info .service{font-size:10px;color:var(--text)}
.appt-status{font-size:8px;padding:2px 8px;border-radius:10px;font-weight:700;text-transform:uppercase;border:none;cursor:pointer;flex-shrink:0}
.cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cal-header button{background:none;border:none;cursor:pointer;color:var(--text);padding:4px;border-radius:6px}
.cal-header span{font-size:13px;font-weight:600;color:var(--text-primary)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;text-align:center}
.cal-day-header{font-size:8px;color:var(--text);padding:3px 0;font-weight:600}
.cal-day{aspect-ratio:1;border-radius:50%;border:none;cursor:pointer;font-size:11px;background:transparent;color:var(--text-primary);font-weight:400;position:relative;display:flex;align-items:center;justify-content:center;padding:0}
.cal-day.selected{background:linear-gradient(135deg,var(--gold),var(--gold-light));color:var(--dark);font-weight:700}
.cal-day .dot{position:absolute;bottom:1px;left:50%;transform:translateX(-50%);width:3px;height:3px;border-radius:50%;background:var(--gold)}
.fin-summary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.fin-card{background:var(--card);border-radius:10px;padding:10px;box-shadow:0 1px 8px var(--shadow);transition:background .3s}
.fin-label{font-size:8px;color:var(--text);text-transform:uppercase;font-weight:600;margin-bottom:2px}
.fin-value{font-size:14px;font-weight:700}
.fin-green{color:var(--green)}.fin-red{color:var(--red)}.fin-gold{color:var(--gold)}
.filter-bar{display:flex;gap:5px;margin-bottom:10px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.filter-btn{padding:5px 12px;border-radius:16px;border:1px solid var(--card-border);font-size:10px;cursor:pointer;font-weight:600;background:var(--card);color:var(--text);white-space:nowrap;transition:all .2s}
.filter-btn.active{background:var(--gold);color:var(--dark);border-color:var(--gold)}
.trans-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--card-border)}
.trans-item:last-child{border:none}
.trans-desc{font-size:12px;color:var(--text-secondary)}
.trans-meta{font-size:9px;color:var(--text);margin-top:1px}
.trans-value{font-weight:700;font-size:13px}
.client-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.client-card{border-radius:10px;border:1px solid var(--card-border);padding:12px;background:var(--card);cursor:pointer;transition:all .2s}
.client-card:active{transform:scale(.97)}
.client-avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--text-primary);margin-bottom:6px}
.client-name{font-size:12px;font-weight:700;color:var(--text-primary);margin-bottom:3px}
.client-stats{display:flex;justify-content:space-between;font-size:9px}
.client-stats span:first-child{color:var(--text)}
.client-stats span:last-child{color:var(--gold);font-weight:700}
.search-box{position:relative;margin-bottom:10px}
.search-box input{width:100%;padding:9px 10px 9px 32px;border-radius:8px;border:1px solid var(--card-border);font-size:12px;outline:none;color:var(--text-primary);background:var(--input-bg);box-sizing:border-box;transition:border-color .3s}
.search-box input:focus{border-color:var(--gold)}
.search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text);pointer-events:none}
.btn-primary{width:100%;background:linear-gradient(135deg,var(--gold),var(--gold-light));border:none;border-radius:10px;color:var(--dark);padding:12px;font-size:13px;font-weight:700;cursor:pointer;margin-bottom:12px;transition:opacity .2s}
.btn-primary:active{opacity:.8}
.btn-primary:disabled{opacity:.5;cursor:default}
.btn-secondary{flex:1;padding:11px;border-radius:8px;border:1px solid var(--card-border);background:var(--card);color:var(--text);font-size:13px;cursor:pointer;font-weight:600;transition:background .3s}
.shortcuts-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.shortcut-primary{grid-column:1/-1;display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,var(--gold),var(--gold-light));border:none;border-radius:14px;color:var(--dark);padding:16px 18px;cursor:pointer;text-align:left;width:100%;box-shadow:0 4px 16px rgba(201,168,76,.35);transition:transform .15s;position:relative;overflow:hidden}
.shortcut-primary:active{transform:scale(.97)}
.shortcut-primary .s-icon{width:42px;height:42px;border-radius:12px;background:rgba(0,0,0,.1);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.shortcut-primary .s-text{flex:1}
.shortcut-primary .s-label{font-size:15px;font-weight:800}
.shortcut-primary .s-hint{font-size:11px;opacity:.7;margin-top:2px}
.shortcut-primary .s-arrow{font-size:18px;opacity:.6}
.shortcut-primary::after{content:'';position:absolute;top:0;left:-50%;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);transform:skewX(-25deg);transition:left .4s}
.shortcut-primary:active::after{left:150%}
.shortcut-secondary{display:flex;flex-direction:column;align-items:flex-start;gap:6px;background:#231620;border:1px solid rgba(201,168,76,.12);border-radius:12px;padding:14px;cursor:pointer;text-align:left;transition:transform .15s;position:relative;overflow:hidden}
.shortcut-secondary:active{transform:scale(.97)}
.shortcut-secondary::after{content:'';position:absolute;top:0;left:-50%;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.04),transparent);transform:skewX(-25deg);transition:left .4s}
.shortcut-secondary:active::after{left:150%}
.shortcut-secondary .s-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.shortcut-secondary .s-label{font-size:13px;font-weight:700;color:var(--text-primary)}
.shortcut-secondary .s-hint{font-size:9px;color:var(--text);line-height:1.3}
.shortcut-tertiary{display:flex;align-items:center;gap:12px;background:#1a1118;border:none;border-radius:12px;padding:12px;cursor:pointer;text-align:left;transition:transform .15s;position:relative;overflow:hidden}
.shortcut-tertiary:active{transform:scale(.97)}
.shortcut-tertiary::after{content:'';position:absolute;top:0;left:-50%;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.03),transparent);transform:skewX(-25deg);transition:left .4s}
.shortcut-tertiary:active::after{left:150%}
.shortcut-tertiary .s-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.shortcut-tertiary .s-text{flex:1}
.shortcut-tertiary .s-label{font-size:12px;font-weight:700;color:var(--text-primary)}
.shortcut-tertiary .s-hint{font-size:9px;color:var(--text);margin-top:1px}
.btn-gold{flex:1;padding:11px;border-radius:8px;border:none;background:linear-gradient(135deg,var(--gold),var(--gold-light));color:var(--dark);font-size:13px;font-weight:700;cursor:pointer}
.btn-gold:active{opacity:.8}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;z-index:200;animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-content{background:var(--card);border-radius:16px 16px 0 0;padding:20px 16px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 -10px 40px rgba(0,0,0,.2);transition:background .3s}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.modal-header h3{font-size:16px;color:var(--text-primary);font-style:italic}
.modal-close{background:none;border:none;cursor:pointer;color:var(--text);padding:4px;border-radius:6px}
.form-group{margin-bottom:12px}
.form-group label{font-size:10px;color:var(--text);font-weight:600;text-transform:uppercase;display:block;margin-bottom:4px;letter-spacing:.3px}
.form-group input,.form-group select{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--card-border);font-size:13px;outline:none;color:var(--text-primary);background:var(--input-bg);box-sizing:border-box;transition:border-color .3s,background .3s,color .3s}
.form-group input:focus,.form-group select:focus{border-color:var(--gold)}
.form-row{display:flex;gap:8px}
.form-row .form-group{flex:1}
.type-toggle{display:flex;gap:6px;margin-bottom:12px}
.type-btn{flex:1;padding:9px;border-radius:8px;border:2px solid var(--card-border);font-size:11px;font-weight:600;cursor:pointer;text-align:center;transition:all .2s}
.type-btn.active{background:var(--green);color:#fff;border-color:var(--green)}
.type-btn.red.active{background:var(--red);border-color:var(--red);color:#fff}
.empty-state{text-align:center;padding:30px 0;color:var(--text)}
.empty-state .icon{font-size:36px;margin-bottom:6px}
.empty-state .msg{font-size:12px}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:8px 18px;border-radius:8px;font-size:12px;z-index:300;animation:fadeIn .3s ease;box-shadow:0 4px 20px rgba(0,0,0,.3)}
@keyframes fadeIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.spinner{width:18px;height:18px;border:2px solid var(--card-border);border-top-color:var(--gold);border-radius:50%;animation:spin .6s linear infinite;display:inline-block;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.steps{display:flex;gap:4px;margin-bottom:14px;justify-content:center}
.step{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;transition:all .2s}
.step.active{background:var(--gold);color:var(--dark)}
.step.done{background:var(--green);color:#fff}
.step.pending{background:var(--card-border);color:var(--text)}
.step-line{width:20px;height:2px;align-self:center;background:var(--card-border);transition:background .2s}
.step-line.done{background:var(--green)}
.hidden{display:none}
.flex{display:flex}.flex-1{flex:1}.gap-6{gap:6px}.gap-8{gap:8px}
.mb-8{margin-bottom:8px}.mb-12{margin-bottom:12px}
.text-center{text-align:center}
.w-100{width:100%}
.service-chip{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:16px;border:1px solid var(--card-border);background:var(--card);font-size:11px;cursor:pointer;margin:3px;transition:all .2s}
.service-chip.active{background:linear-gradient(135deg,var(--gold),var(--gold-light));color:var(--dark);border-color:var(--gold)}
.service-chip .del{color:var(--red);font-weight:700;margin-left:4px;cursor:pointer}
.badge{display:inline-block;padding:1px 6px;border-radius:8px;font-size:8px;font-weight:700;margin-left:4px;vertical-align:middle}
.badge-green{background:var(--green);color:#fff}
.badge-red{background:var(--red);color:#fff}
.toggle-wrap{display:flex;align-items:center;gap:8px}
.toggle{width:40px;height:22px;background:var(--card-border);border-radius:11px;position:relative;cursor:pointer;border:none;padding:0;transition:background .2s}
.toggle.on{background:var(--gold)}
.toggle .knob{width:18px;height:18px;background:#fff;border-radius:50%;position:absolute;top:2px;left:2px;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on .knob{transform:translateX(18px)}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $$ = s=>document.querySelector(s)
const DAYS = ['Dom','Seg','Ter','Qua','Qui','Sex','Sab']
const MONTHS = ['Janeiro','Fevereiro','Marco','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro']
const STATUS = {confirmado:'#c9a84c',pendente:'#e0a0c0',cancelado:'#bbb',concluido:'#7dc9a0'}

function today(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}

function load(key,fallback){try{const v=localStorage.getItem(key);return v?JSON.parse(v):fallback}catch{return fallback}}

let defServices = ['Corte','Coloracao','Hidratacao','Escova','Progressiva','Luzes','Manicure','Pedicure']
let state = {
  tab:'dashboard',subtab:null,selectedDate:today(),
  appointments:load('appts',[
    {id:1,client:'Ana Paula',service:'Coloracao',time:'09:00',date:'2026-05-20',status:'confirmado',value:180,prof:''},
    {id:2,client:'Carla Mendes',service:'Escova',time:'11:30',date:'2026-05-20',status:'concluido',value:80,prof:''},
    {id:3,client:'Fernanda Lima',service:'Corte',time:'14:00',date:'2026-05-20',status:'confirmado',value:65,prof:''},
  ]),
  transactions:load('trans',[
    {id:1,desc:'Coloracao - Ana Paula',type:'entrada',value:180,date:'2026-05-19',cat:'Servico'},
    {id:2,desc:'Tinta L\'Oreal',type:'saida',value:95,date:'2026-05-17',cat:'Material'},
    {id:3,desc:'Aluguel salao',type:'saida',value:1200,date:'2026-05-10',cat:'Fixo'},
  ]),
  services:load('services',defServices.map((n,i)=>({id:i+1,name:n,price:i===0?65:i===1?180:i===2?90:i===3?80:i===4?280:i===5?220:i===6?45:60}))),
  pros:load('pros',[{id:1,name:'Camila'},{id:2,name:'Juliana'},{id:3,name:'Larissa'}]),
  calMonth:new Date().getMonth(),calYear:new Date().getFullYear(),
  filterFin:'todos',clientSearch:'',clientDetail:null,
  toast:null,loading:false,
  showModal:false,showTransModal:false,showServicesModal:false,showProModal:false,
  stepModal:false,step:1,totalSteps:4,
  editingAppt:null,editingService:null,editingPro:null,
  darkMode:load('darkMode',false),
  formAppt:{client:'',service:'',prof:'',time:'09:00',date:today(),value:''},
  formTrans:{desc:'',type:'entrada',value:'',date:today(),cat:'Servico'},
  formService:{name:'',price:''},
  formPro:{name:''},
  notifEnabled:load('notifEnabled',false)
}

function save(){localStorage.setItem('appts',JSON.stringify(state.appointments));localStorage.setItem('trans',JSON.stringify(state.transactions));localStorage.setItem('services',JSON.stringify(state.services));localStorage.setItem('pros',JSON.stringify(state.pros));localStorage.setItem('darkMode',JSON.stringify(state.darkMode));localStorage.setItem('notifEnabled',JSON.stringify(state.notifEnabled))}

function svg(path,size=16){return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${path}</svg>`}
const I={
  dash:svg('<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',20),
  cal:svg('<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',20),
  fin:svg('<line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',20),
  cli:svg('<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',20),
  servicos:svg('<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',20),
  plus:'<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
  x:'<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
  search:'<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
  left:'<polyline points="15 18 9 12 15 6"/>',
  right:'<polyline points="9 18 15 12 9 6"/>',
  edit:'<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>',
  trash:'<polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  arrowUp:'<line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>',

function render(){
  const s=state,m=dark()?'dark':''
  if(s.darkMode)document.documentElement.classList.add('dark')
  else document.documentElement.classList.remove('dark')
  document.querySelector('meta[name=theme-color]').content=s.darkMode?'#0d060e':'#1a0a14'

  const app=$$('#app')
  const todayAppts=s.appointments.filter(a=>a.date===s.selectedDate).sort((a,b)=>a.time.localeCompare(b.time))
  const entradas=s.transactions.filter(t=>t.type==='entrada').reduce((x,t)=>x+t.value,0)
  const saidas=s.transactions.filter(t=>t.type==='saida').reduce((x,t)=>x+t.value,0)
  const lucro=entradas-saidas
  const apptDates=new Set(s.appointments.map(a=>a.date))
  const daysInMonth=new Date(s.calYear,s.calMonth+1,0).getDate()
  const firstDay=new Date(s.calYear,s.calMonth,1).getDay()
  const filteredTrans=s.transactions.filter(t=>s.filterFin==='todos'||t.type===s.filterFin)
  const allClients=[...new Set(s.appointments.map(a=>a.client))]
  const filteredClients=s.clientSearch?allClients.filter(c=>c.toLowerCase().includes(s.clientSearch.toLowerCase())):allClients
  const colors=['#e0a0c0','#c9a84c','#7dc9a0','#c97a7a','#a0c0e0','#c0a0e0','#e0c0a0','#a0e0c0']

  const navItems=[
    {id:'dashboard',label:'Inicio',icon:I.dash},
    {id:'agenda',label:'Agenda',icon:I.cal},
    {id:'financeiro',label:'Financas',icon:I.fin},
    {id:'clientes',label:'Clientes',icon:I.cli},
    {id:'servicos',label:'Servicos',icon:I.servicos},
  ]

  const stepsHtml=s.stepModal?`
    <div class="steps">
      ${Array(s.totalSteps).fill().map((_,i)=>{
        const n=i+1;let cls='pending'
        if(n===s.step)cls='active'
        else if(n<s.step)cls='done'
        return `<div class="step ${cls}">${n<s.step?svg(I.check,12):n}</div>${i<s.totalSteps-1?`<div class="step-line${n<=s.step?' done':''}"></div>`:''}`
      }).join('')}
    </div>
  `:''

  app.innerHTML=`
<header class="header">
  <div class="header-brand">
    <div class="header-logo">&#9986;</div>
    <span class="header-title">Studio Glamour</span>
  </div>
  <div class="header-actions">
    <button class="icon-btn" onclick="toggleDark()" title="Modo escuro">${svg(s.darkMode?I.sun:I.moon,18)}</button>
    <button class="header-btn" onclick="startBooking()">${svg(I.plus,12)} Novo</button>
  </div>
</header>

<nav class="tabbar">
  ${navItems.map(n=>`<button onclick="setTab('${n.id}')" class="${s.tab===n.id?'active':''}">${n.icon}${n.label}</button>`).join('')}
</nav>

<main class="main">
  ${s.subtab==='clientDetail'?renderClientDetail(s,colors):
    s.tab==='dashboard'?renderDashboard(entradas,saidas,lucro,todayAppts,s):
    s.tab==='agenda'?renderAgenda(s,firstDay,daysInMonth,apptDates,todayAppts):
    s.tab==='financeiro'?renderFinance(entradas,saidas,lucro,filteredTrans,s.filterFin):
    s.tab==='clientes'?renderClients(s.clientSearch,filteredClients,s.appointments,colors,s):
    s.tab==='servicos'?renderServicos(s):
    ''}
</main>

${s.toast?`<div class="toast">${s.toast}</div>`:''}
${s.showModal?renderApptModal(s,stepsHtml):''}
${s.showTransModal?renderTransModal(s):''}
${s.showServicesModal?renderServicesModal(s):''}
${s.showProModal?renderProModal(s):''}
${s.stepModal?s.loading?`<div class="modal-overlay"><div class="modal-content"><div class="text-center" style="padding:30px"><div class="spinner"></div><div style="margin-top:10px;color:var(--text);font-size:13px">Salvando...</div></div></div></div>`:'':''}
`}

function dark(){return state.darkMode}
function toggleDark(){state.darkMode=!state.darkMode;save();render()}

      <div class="kpi-card" style="border-color:var(--pink)"><div class="kpi-label">Agendamentos</div><div class="kpi-value">${s.appointments.length}</div></div>

        todayAppts.map(a=>`
          <div class="appt-item">
            <div class="appt-time"><div class="t">${a.time}</div></div>
            <div class="appt-info"><div class="name">${a.client}</div><div class="service">${a.service}${a.prof?' • '+a.prof:''}</div></div>

              <option value="confirmado" ${a.status==='confirmado'?'selected':''}>Confirmado</option>
              <option value="concluido" ${a.status==='concluido'?'selected':''}>Concluido</option>

      <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:12px"><span style="color:var(--text)">Saidas</span><span style="font-weight:700;color:var(--red)">R$ ${saidas.toLocaleString('pt-BR')}</span></div>

      <div style="background:var(--rose2);border-radius:6px;padding:8px;margin-top:6px">

        <div style="height:4px;background:var(--card-border);border-radius:4px;overflow:hidden"><div style="height:100%;width:${Math.min(margem,100)}%;background:linear-gradient(90deg,var(--gold),var(--gold-light));border-radius:4px"></div></div>

function renderAgenda(s,firstDay,daysInMonth,apptDates,todayAppts){
  return`
    <div class="card">
      <div class="cal-header">
        <button onclick="prevMonth()">${svg(I.left,14)}</button>
        <span>${MONTHS[s.calMonth]} ${s.calYear}</span>
        <button onclick="nextMonth()">${svg(I.right,14)}</button>
      </div>
      <div class="cal-grid">
        ${DAYS.map(d=>`<div class="cal-day-header">${d}</div>`).join('')}
        ${Array(firstDay).fill().map((_,i)=>`<div></div>`).join('')}
        ${Array(daysInMonth).fill().map((_,i)=>{
          const day=i+1,ds=s.calYear+'-'+String(s.calMonth+1).padStart(2,'0')+'-'+String(day).padStart(2,'0')
          const sel=ds===s.selectedDate,has=apptDates.has(ds)
          return `<button class="cal-day${sel?' selected':''}" onclick="selectDate('${ds}')">${day}${has&&!sel?'<span class="dot"></span>':''}</button>`
        }).join('')}
      </div>
    </div>
    <div class="card">
      <div class="card-title" style="margin-bottom:10px">${s.selectedDate===today()?'Hoje':s.selectedDate.split('-').reverse().join('/')} — ${todayAppts.length}</div>
      ${todayAppts.length===0?`<div class="empty-state"><div class="icon">&#128197;</div><div class="msg">Nenhum agendamento</div></div>`:
        todayAppts.map(a=>`
          <div class="appt-item">
            <div class="appt-time"><div class="t">${a.time}</div></div>
            <div class="appt-info"><div class="name">${a.client}</div><div class="service">${a.service}${a.prof?' • '+a.prof:''} — R$ ${a.value}</div></div>
            <div style="display:flex;gap:3px;flex-shrink:0">

function renderClientDetail(s,colors){
  const client=s.clientDetail
  if(!client)return''
  const apps=s.appointments.filter(a=>a.client===client).sort((a,b)=>b.date.localeCompare(a.date))
  const total=apps.reduce((x,a)=>x+a.value,0)
  const idx=[...new Set(s.appointments.map(a=>a.client))].indexOf(client)
  const c=colors[Math.max(0,idx)%colors.length]
  return`
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
      <button onclick="goBack()" style="background:none;border:none;cursor:pointer;color:var(--text);padding:4px">${svg(I.back,18)}</button>
      <div class="client-avatar" style="width:40px;height:40px;font-size:18px;background:${c}44;border:1px solid ${c}66;border-radius:50%;display:flex;align-items:center;justify-content:center">${client.charAt(0)}</div>
      <div><div style="font-size:16px;font-weight:700;color:var(--text-primary)">${client}</div><div style="font-size:11px;color:var(--text)">${apps.length} visita${apps.length!==1?'s':''} • Total: R$ ${total}</div></div>
    </div>
    <div class="card">
      <div class="card-title">Historico de Servicos</div>
      ${apps.length===0?`<div class="empty-state"><div class="msg">Nenhum servico</div></div>`:
        apps.map(a=>`
          <div class="appt-item">
            <div class="appt-time"><div class="t">${a.date.slice(8)}</div><div style="font-size:8px;color:var(--text)">${MONTHS[parseInt(a.date.slice(5,7))-1].slice(0,3)}</div></div>

}

  let body=''
  if(isEdit||!s.stepModal){
    body=`
      <div class="form-group"><label>Cliente</label><input placeholder="Nome" value="${s.formAppt.client}" oninput="formAppt('client',this.value)"></div>
      <div class="form-row">
        <div class="form-group"><label>Data</label><input type="date" value="${s.formAppt.date}" oninput="formAppt('date',this.value)"></div>
        <div class="form-group"><label>Horario</label><input type="time" value="${s.formAppt.time}" oninput="formAppt('time',this.value)"></div>
      </div>
      <div class="form-group"><label>Servico</label><select onchange="formAppt('service',this.value)">${svcs.map(sv=>`<option value="${sv.name}" ${s.formAppt.service===sv.name?'selected':''}>${sv.name} — R$ ${sv.price}</option>`).join('')}</select></div>
      ${pros.length?`<div class="form-group"><label>Profissional</label><select onchange="formAppt('prof',this.value)"><option value="">Qualquer</option>${pros.map(p=>`<option value="${p.name}" ${s.formAppt.prof===p.name?'selected':''}>${p.name}</option>`).join('')}</select></div>`:''}
      <div class="form-group"><label>Valor (R$)</label><input type="number" placeholder="0" value="${s.formAppt.value}" oninput="formAppt('value',this.value)"></div>
      <div style="display:flex;gap:8px;margin-top:4px">
        <button class="btn-secondary" onclick="closeModal()">Cancelar</button>
        <button class="btn-gold" onclick="${isEdit?'saveEditAppt()':'saveApptDirect()'}">${isEdit?'Salvar':'Agendar'}</button>
      </div>`
  }else{
    if(s.step===1) body=step1(svcs)
    else if(s.step===2) body=step2(pros)
    else if(s.step===3) body=step3(s)
    else if(s.step===4) body=step4(s)
  }

  return`
    <div class="modal-overlay" onclick="closeModal(event)">
      <div class="modal-content">
        <div class="modal-header">
          <h3>${title}</h3>
          <button class="modal-close" onclick="closeModal()">${svg(I.x,16)}</button>
        </div>
        ${stepsHtml}
        ${body}
      </div>
    </div>`
}

function step1(svcs){
  return`
    <div class="form-group"><label>Escolha o servico</label></div>
    ${svcs.map(sv=>`
      <div onclick="stepSelectService(${sv.id})" style="display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:8px;border:1px solid var(--card-border);margin-bottom:6px;cursor:pointer;background:var(--card);transition:all .2s">
        <span style="font-size:13px;color:var(--text-primary)">${sv.name}</span>
        <span style="font-weight:700;color:var(--gold);font-size:13px">R$ ${sv.price}</span>
      </div>
    `).join('')}
  `
}

function step2(pros){
  if(!pros.length) return step3(state)
  return`
    <div class="form-group"><label>Escolha o profissional</label></div>
    <div onclick="stepSelectPro('')" style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;border:1px solid var(--card-border);margin-bottom:6px;cursor:pointer;background:var(--card)">
      <span style="font-size:13px;color:var(--text-primary)">Qualquer profissional</span>
    </div>
    ${pros.map(p=>`
      <div onclick="stepSelectPro('${p.name}')" style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;border:1px solid var(--card-border);margin-bottom:6px;cursor:pointer;background:var(--card)">
        <div style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-light));display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--dark)">${p.name.charAt(0)}</div>
        <span style="font-size:13px;color:var(--text-primary)">${p.name}</span>
      </div>
    `).join('')}
  `
}

function step3(s){
  return`
    <div class="form-group"><label>Data e horario</label></div>
    <div class="form-row">
      <div class="form-group"><input type="date" value="${s.formAppt.date}" oninput="formAppt('date',this.value)"></div>
      <div class="form-group"><input type="time" value="${s.formAppt.time}" oninput="formAppt('time',this.value)"></div>
    </div>
    <div style="margin-top:12px;display:flex;flex-wrap:wrap;gap:4px">
      ${['08:00','09:00','10:00','11:00','13:00','14:00','15:00','16:00','17:00','18:00'].map(t=>
        `<span class="service-chip${s.formAppt.time===t?' active':''}" onclick="formAppt('time','${t}')">${t}</span>`
      ).join('')}
    </div>
  `
}

function step4(s){
  const svc=s.services.find(x=>x.name===s.formAppt.service)
  return`
    <div style="text-align:center;padding:10px 0">
      <div style="font-size:40px;margin-bottom:8px">&#9986;</div>
      <div style="font-size:16px;font-weight:700;color:var(--text-primary);margin-bottom:4px">${s.formAppt.client}</div>
      <div style="font-size:13px;color:var(--text);margin-bottom:2px">${s.formAppt.service}${s.formAppt.prof?' com '+s.formAppt.prof:''}</div>
      <div style="font-size:13px;color:var(--text);margin-bottom:8px">${s.formAppt.date.split('-').reverse().join('/')} as ${s.formAppt.time}</div>
      <div style="font-size:20px;font-weight:700;color:var(--gold)">R$ ${s.formAppt.value||(svc?svc.price:'0')}</div>
    </div>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="btn-secondary" onclick="prevStep()">Voltar</button>
      <button class="btn-gold" onclick="finishBooking()">Confirmar</button>
    </div>
  `
}

function renderTransModal(s){
  return`
    <div class="modal-overlay" onclick="closeTransModal(event)">
      <div class="modal-content">
        <div class="modal-header"><h3>Novo Lancamento</h3><button class="modal-close" onclick="closeTransModal()">${svg(I.x,16)}</button></div>
        <div class="type-toggle">
          <div class="type-btn${s.formTrans.type==='entrada'?' active':''}" onclick="formTrans('type','entrada');render()">Entrada</div>
          <div class="type-btn red${s.formTrans.type==='saida'?' active':''}" onclick="formTrans('type','saida');render()">Saida</div>
        </div>
        <div class="form-group"><label>Descricao</label><input placeholder="Ex: Corte - Maria" value="${s.formTrans.desc}" oninput="formTrans('desc',this.value)"></div>
        <div class="form-row">
          <div class="form-group"><label>Valor (R$)</label><input type="number" placeholder="0" value="${s.formTrans.value}" oninput="formTrans('value',this.value)"></div>
          <div class="form-group"><label>Data</label><input type="date" value="${s.formTrans.date}" oninput="formTrans('date',this.value)"></div>
        </div>
        <div class="form-group"><label>Categoria</label><select onchange="formTrans('cat',this.value)">
          <option value="Servico" ${s.formTrans.cat==='Servico'?'selected':''}>Servico</option>
          <option value="Material" ${s.formTrans.cat==='Material'?'selected':''}>Material</option>
          <option value="Fixo" ${s.formTrans.cat==='Fixo'?'selected':''}>Fixo</option>
          <option value="Outros" ${s.formTrans.cat==='Outros'?'selected':''}>Outros</option>
        </select></div>
        <div style="display:flex;gap:8px"><button class="btn-secondary" onclick="closeTransModal()">Cancelar</button><button class="btn-gold" onclick="saveTrans()">Salvar</button></div>
      </div>
    </div>`
}

function renderServicesModal(s){
  const isEdit=s.editingService
  return`
    <div class="modal-overlay" onclick="closeServiceModal(event)">
      <div class="modal-content">
        <div class="modal-header"><h3>${isEdit?'Editar':'Novo'} Servico</h3><button class="modal-close" onclick="closeServiceModal()">${svg(I.x,16)}</button></div>
        <div class="form-group"><label>Nome</label><input value="${s.formService.name}" oninput="formService('name',this.value)" placeholder="Ex: Corte feminino"></div>
        <div class="form-group"><label>Preco (R$)</label><input type="number" value="${s.formService.price}" oninput="formService('price',this.value)" placeholder="0"></div>
        <div style="display:flex;gap:8px"><button class="btn-secondary" onclick="closeServiceModal()">Cancelar</button><button class="btn-gold" onclick="saveService()">${isEdit?'Salvar':'Adicionar'}</button></div>
      </div>
    </div>`
}

function renderProModal(s){
  const isEdit=s.editingPro
  return`
    <div class="modal-overlay" onclick="closeProModal(event)">
      <div class="modal-content">
        <div class="modal-header"><h3>${isEdit?'Editar':'Novo'} Profissional</h3><button class="modal-close" onclick="closeProModal()">${svg(I.x,16)}</button></div>
        <div class="form-group"><label>Nome</label><input value="${s.formPro.name}" oninput="formPro('name',this.value)" placeholder="Nome do profissional"></div>
        <div style="display:flex;gap:8px"><button class="btn-secondary" onclick="closeProModal()">Cancelar</button><button class="btn-gold" onclick="savePro()">${isEdit?'Salvar':'Adicionar'}</button></div>
      </div>
    </div>`
}

/* === ACTIONS === */
function setTab(t){state.tab=t;state.subtab=null;state.clientDetail=null;render()}
function selectDate(d){state.selectedDate=d;render()}
function prevMonth(){if(state.calMonth===0){state.calMonth=11;state.calYear--}else state.calMonth--;render()}
function nextMonth(){if(state.calMonth===11){state.calMonth=0;state.calYear++}else state.calMonth++;render()}

function openSettings(){state.tab='servicos';state.subtab=null;render()}
/* BOOKING STEP */
function startBooking(){
  state.stepModal=true;state.step=1;state.editingAppt=null
  state.formAppt={client:'',service:state.services[0]?state.services[0].name:'',prof:'',time:'09:00',date:state.selectedDate,value:''}
  render()
}
function stepSelectService(id){
  const sv=state.services.find(x=>x.id===id)
  if(!sv)return
  state.formAppt.service=sv.name;state.formAppt.value=sv.price.toString()
  state.step=2;render()
}
function stepSelectPro(name){
  state.formAppt.prof=name;state.step=3;render()
}
function prevStep(){state.step--;render()}
function finishBooking(){
  const f=state.formAppt
  if(!f.client||!f.service||!f.value)return toast('Preencha todos os campos')
  state.appointments.push({id:Date.now(),client:f.client,service:f.service,prof:f.prof||'',time:f.time,date:f.date,status:'pendente',value:parseFloat(f.value)})
  save();state.stepModal=false;toast('Agendamento criado!')
  if(state.notifEnabled&&'Notification'in window&&Notification.permission==='granted'){
    const d=new Date(f.date+'T'+f.time);const n=new Notification('Studio Glamour',{body:`${f.client} — ${f.service} as ${f.time}`,icon:'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><text y="18" font-size="16">✂️</text></svg>'})
  }
  render()
}
function saveApptDirect(){
  const f=state.formAppt
  if(!f.client||!f.value||!f.service)return toast('Preencha todos os campos')
  state.appointments.push({id:Date.now(),client:f.client,service:f.service,prof:f.prof||'',time:f.time,date:f.date,status:'pendente',value:parseFloat(f.value)})
  save();state.showModal=false;state.editingAppt=null;toast('Agendamento criado!');render()
}

function openModal(){state.showModal=true;state.stepModal=false;state.editingAppt=null;state.formAppt={client:'',service:state.services[0]?state.services[0].name:'',prof:'',time:'09:00',date:state.selectedDate,value:''};render()}
function closeModal(e){if(e&&e.target!==e.currentTarget)return;state.showModal=false;state.stepModal=false;state.editingAppt=null;render()}
function formAppt(f,v){state.formAppt[f]=v}
function editAppt(id){
  const a=state.appointments.find(x=>x.id===id)
  if(!a)return
  state.editingAppt=a;state.stepModal=false;state.showModal=true
  state.formAppt={client:a.client,service:a.service,prof:a.prof||'',time:a.time,date:a.date,value:a.value.toString()};render()
}
function saveEditAppt(){
  const f=state.formAppt,e=state.editingAppt
  if(!f.client||!f.value)return toast('Preencha todos os campos')
  state.appointments=state.appointments.map(a=>a.id===e.id?{...a,...f,value:parseFloat(f.value)}:a)
  save();state.showModal=false;state.editingAppt=null;toast('Atualizado!');render()
}
function deleteAppt(id){
  if(!confirm('Excluir agendamento?'))return
  state.appointments=state.appointments.filter(a=>a.id!==id);save();toast('Excluido!');render()
}
function updateStatus(id,st){
  state.appointments=state.appointments.map(a=>a.id===id?{...a,status:st}:a);save()
  if(st==='concluido'){
    const a=state.appointments.find(x=>x.id===id)
    if(a&&!state.transactions.find(t=>t.desc.includes(a.client)&&t.desc.includes(a.service)))
      state.transactions.push({id:Date.now(),desc:`${a.service} — ${a.client}`,type:'entrada',value:a.value,date:a.date,cat:'Servico'})
    save()
  }
  render()
}

/* FINANCE */
function setFilter(f){state.filterFin=f;render()}
function openTransModal(){state.showTransModal=true;state.formTrans={desc:'',type:'entrada',value:'',date:today(),cat:'Servico'};render()}
function closeTransModal(e){if(e&&e.target!==e.currentTarget)return;state.showTransModal=false;render()}
function formTrans(f,v){state.formTrans[f]=v;render()}
function saveTrans(){
  const f=state.formTrans
  if(!f.desc||!f.value)return toast('Preencha todos os campos')
  state.transactions.push({id:Date.now(),desc:f.desc,type:f.type,value:parseFloat(f.value),date:f.date,cat:f.cat})
  save();state.showTransModal=false;toast('Lancamento criado!');render()
}
function deleteTrans(id){
  if(!confirm('Excluir lancamento?'))return
  state.transactions=state.transactions.filter(t=>t.id!==id);save();toast('Excluido!');render()
}

/* CLIENTS */
function searchClient(v){state.clientSearch=v;render()}
function viewClient(name){state.clientDetail=name;state.subtab='clientDetail';render()}
function goBack(){state.subtab=null;state.clientDetail=null;render()}

/* SERVICES */
function openServiceModal(service){
  state.showServicesModal=true
  state.editingService=service||null
  state.formService=service?{name:service.name,price:service.price.toString()}:{name:'',price:''}
  render()
}
function closeServiceModal(e){if(e&&e.target!==e.currentTarget)return;state.showServicesModal=false;state.editingService=null;render()}
function formService(f,v){state.formService[f]=v}
function saveService(){
  const f=state.formService
  if(!f.name||!f.price)return toast('Preencha todos os campos')
  if(state.editingService){
    state.services=state.services.map(s=>s.id===state.editingService.id?{...s,name:f.name,price:parseFloat(f.price)}:s)
  }else{
    state.services.push({id:Date.now(),name:f.name,price:parseFloat(f.price)})
  }
  save();state.showServicesModal=false;state.editingService=null;toast('Servico salvo!');render()
}
function deleteService(id){
  if(!confirm('Excluir servico?'))return
  state.services=state.services.filter(s=>s.id!==id);save();render()
}

/* PROFESSIONALS */
function openProModal(pro){
  state.showProModal=true
  state.editingPro=pro||null
  state.formPro=pro?{name:pro.name}:{name:''}
  render()
}
function closeProModal(e){if(e&&e.target!==e.currentTarget)return;state.showProModal=false;state.editingPro=null;render()}
function formPro(f,v){state.formPro[f]=v}
function savePro(){
  const f=state.formPro
  if(!f.name)return toast('Digite o nome')
  if(state.editingPro){
    state.pros=state.pros.map(p=>p.id===state.editingPro.id?{...p,name:f.name}:p)
  }else{
    state.pros.push({id:Date.now(),name:f.name})
  }
  save();state.showProModal=false;state.editingPro=null;toast('Profissional salvo!');render()
}
function deletePro(id){
  if(!confirm('Excluir profissional?'))return
  state.pros=state.pros.filter(p=>p.id!==id);save();render()
}

/* NOTIFICATIONS */
function toggleNotif(){
  if(state.notifEnabled){
    state.notifEnabled=false;save();render();return
  }
  if(!('Notification'in window)){toast('Notificacoes nao suportadas');return}
  if(Notification.permission==='granted'){state.notifEnabled=true;save();render();toast('Notificacoes ativadas!');return}
  if(Notification.permission==='denied'){toast('Notificacoes bloqueadas no navegador');return}
  Notification.requestPermission().then(p=>{
    if(p==='granted'){state.notifEnabled=true;save();render();toast('Notificacoes ativadas!')}
    else toast('Permissao negada')
  })
}

/* DATA */
function clearData(){
  if(!confirm('Tem certeza? Todos os dados serao perdidos!'))return
  const d=[...state.services],p=[...state.pros]
  state.appointments=[];state.transactions=[]
  localStorage.removeItem('appts');localStorage.removeItem('trans');save();toast('Dados limpos!');render()
}

/* TOAST */
function toast(msg){state.toast=msg;render();setTimeout(()=>{state.toast=null;render()},2000)}

/* SW */
if('serviceWorker'in navigator){
  const swCode='self.addEventListener("install",e=>{self.skipWaiting()});self.addEventListener("fetch",e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request)))})'
  const blob=new Blob([swCode],{type:'application/javascript'})
  const url=URL.createObjectURL(blob)
  navigator.serviceWorker.register(url).catch(()=>{})
}

/* PWA Manifest */
(function(){
  const m=document.getElementById('manifest-link')
  const manifest={
    name:'Studio Glamour',short_name:'Glamour',start_url:'.',display:'standalone',
    background_color:'#1a0a14',theme_color:'#1a0a14',
    icons:[{src:'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><circle cx="24" cy="24" r="24" fill="%23c9a84c"/><text x="24" y="32" font-size="28" text-anchor="middle" fill="%231a0a14">&#9986;</text></svg>',sizes:'48x48',type:'image/svg+xml'}]
  }
  m.href='data:application/json,'+encodeURIComponent(JSON.stringify(manifest))
})()

render()
</script>
</body>
</html>

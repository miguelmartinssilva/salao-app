function syncClients(){
  const names=[...new Set(state.appointments.map(a=>a.client))]
  names.forEach(n=>{if(!state.clients.find(c=>c.name===n))state.clients.push({id:Date.now()+Math.random()*1000|0,name:n,phone:'',whatsapp:'',birth:'',notes:'',active:true,createdAt:today()})})
  save()
}

function getClientInfo(name){
  const cl=state.clients.find(c=>c.name===name)
  const apps=state.appointments.filter(a=>a.client===name).sort((a,b)=>b.date.localeCompare(a.date))
  const total=apps.reduce((x,a)=>x+a.value,0)
  const favSvc={};apps.forEach(a=>{favSvc[a.service]=(favSvc[a.service]||0)+1})
  const fav=Object.keys(favSvc).sort((a,b)=>favSvc[b]-favSvc[a])[0]||''
  const lastAppt=apps[0]||null
  const nextAppt=state.appointments.filter(a=>a.client===name&&a.date>=today()&&a.status!=='cancelado'&&a.status!=='concluido').sort((a,b)=>a.date.localeCompare(b.date)||a.time.localeCompare(b.time))[0]||null
  const freq=apps.length>=3?'frequente':apps.length>=1?'novo':'inativo'
  const isBirthday=cl&&cl.birth?(new Date(cl.birth).getMonth()===new Date().getMonth()&&new Date(cl.birth).getDate()===new Date().getDate()):false
  return {cl,apps,total,fav,lastAppt,nextAppt,freq,isBirthday}
}

function renderClients(search,clients,appts,colors,s){
  syncClients()
  const now=new Date();const curMonth=now.getMonth()
  let filtered=[...state.clients].filter(c=>{
    if(s.clientFilter==='ativos'&&!c.active)return false
    if(s.clientFilter==='inativos'&&c.active)return false
    if(s.clientFilter==='aniversariantes'){
      if(!c.birth)return false
      const b=new Date(c.birth)
      if(b.getMonth()!==curMonth)return false
    }
    if(search){
      const q=search.toLowerCase()
      if(!c.name.toLowerCase().includes(q)&&!c.phone.includes(q)&&!(c.whatsapp||'').includes(q))return false
    }
    return true
  })

  const getSortVal=(c)=>{
    const info=getClientInfo(c.name)
    if(s.clientSort==='recente')return info.lastAppt?info.lastAppt.date:'0000-00-00'
    if(s.clientSort==='frequente')return -info.apps.length
    if(s.clientSort==='gasto')return -info.total
    return c.name.toLowerCase()
  }
  if(s.clientSort==='nome')filtered.sort((a,b)=>a.name.localeCompare(b.name))
  else filtered.sort((a,b)=>getSortVal(a)<getSortVal(b)?-1:1)

  const nClient=filtered.length
  const filters=['todos','ativos','inativos','aniversariantes']
  const sorts=['nome','recente','frequente','gasto']

  return`
    <div style="display:flex;gap:6px;margin-bottom:10px">
      <div style="flex:1;position:relative">
        <span style="position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text);pointer-events:none">${svg(I.search,12)}</span>
        <input placeholder="Buscar nome ou telefone..." value="${search}" oninput="searchClient(this.value)" style="width:100%;padding:9px 10px 9px 32px;border-radius:8px;border:1px solid var(--card-border);font-size:12px;outline:none;color:var(--text-primary);background:var(--input-bg);box-sizing:border-box">

function renderApptModal(s,stepsHtml){
  const isEdit=s.editingAppt
  const title=isEdit?'Editar Agendamento':s.stepModal?`Passo ${s.step} de ${s.totalSteps}`:'Novo Agendamento'
  const svcs=s.services
  const pros=s.pros

  let body=''
  if(isEdit||!s.stepModal){
    body=`
      <div class="form-group"><label>Cliente</label><input placeholder="Nome" value="${s.formAppt.client}" oninput="formAppt('client',this.value)"></div>
      <div class="form-row">
        <div class="form-group"><label>Data</label><input type="date" value="${s.formAppt.date}" oninput="formAppt('date',this.value)"></div>
        <div class="form-group"><label>Horario</label><input type="time" value="${s.formAppt.time}" oninput="formAppt('time',this.value)"></div>
      </div>
      <div class="form-group"><label>Servico</label><select onchange="formAppt('service',this.value)">${svcs.map(sv=>`<option value="${sv.name}" ${s.formAppt.service===sv.name?'selected':''}>${sv.name} — R$ ${sv.price}</option>`).join('')}</select></div>
      ${pros.length?`<div class="form-group"><label>Profissional</label><select onchange="formAppt('prof',this.value)"><option value="">Qualquer</option>${pros.map(p=>`<option value="${p.name}" ${s.formAppt.prof===p.name?'selected':''}>${p.name}</option>`).join('')}</select></div>`:''}
      <div class="form-group"><label>Valor (R$)</label><input type="number" placeholder="0" value="${s.formAppt.value}" oninput="formAppt('value',this.value)"></div>
      <div style="display:flex;gap:8px;margin-top:4px">
        <button class="btn-secondary" onclick="closeModal()">Cancelar</button>
        <button class="btn-gold" onclick="${isEdit?'saveEditAppt()':'saveApptDirect()'}">${isEdit?'Salvar':'Agendar'}</button>
      </div>`
  }else{
    if(s.step===1) body=step1(svcs)
    else if(s.step===2) body=step2(pros)
    else if(s.step===3) body=step3(s)
    else if(s.step===4) body=step4(s)
  }

  return`
    <div class="modal-overlay" onclick="closeModal(event)">
      <div class="modal-content">
        <div class="modal-header">
          <h3>${title}</h3>
          <button class="modal-close" onclick="closeModal()">${svg(I.x,16)}</button>
        </div>
        ${stepsHtml}
        ${body}
      </div>
    </div>`
}

/* === ACTIONS === */
function setTab(t){state.tab=t;state.subtab=null;state.clientDetail=null;render()}
function selectDate(d){state.selectedDate=d;render()}
function prevMonth(){if(state.calMonth===0){state.calMonth=11;state.calYear--}else state.calMonth--;render()}
function nextMonth(){if(state.calMonth===11){state.calMonth=0;state.calYear++}else state.calMonth++;render()}

function openSettings(){state.tab='servicos';state.subtab=null;render()}
/* BOOKING STEP */
function startBooking(){
  state.stepModal=true;state.step=1;state.editingAppt=null
  state.formAppt={client:'',service:state.services[0]?state.services[0].name:'',prof:'',time:'09:00',date:state.selectedDate,value:''}
  render()
}
function stepSelectService(id){
  const sv=state.services.find(x=>x.id===id)
  if(!sv)return
  state.formAppt.service=sv.name;state.formAppt.value=sv.price.toString()
  state.step=2;render()
}
function stepSelectPro(name){
  state.formAppt.prof=name;state.step=3;render()
}
function prevStep(){state.step--;render()}
function finishBooking(){
  const f=state.formAppt
  if(!f.client||!f.service||!f.value)return toast('Preencha todos os campos')
  state.appointments.push({id:Date.now(),client:f.client,service:f.service,prof:f.prof||'',time:f.time,date:f.date,status:'pendente',value:parseFloat(f.value)})
  save();state.stepModal=false;toast('Agendamento criado!')
  if(state.notifEnabled&&'Notification'in window&&Notification.permission==='granted'){
    const d=new Date(f.date+'T'+f.time);const n=new Notification('Martins MegaHair',{body:`${f.client} — ${f.service} as ${f.time}`,icon:'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><text y="18" font-size="16">✂️</text></svg>'})
  }
  render()
}
function saveApptDirect(){
  const f=state.formAppt
  if(!f.client||!f.value||!f.service)return toast('Preencha todos os campos')
  state.appointments.push({id:Date.now(),client:f.client,service:f.service,prof:f.prof||'',time:f.time,date:f.date,status:'pendente',value:parseFloat(f.value)})

}

function openModal(){state.showModal=true;state.stepModal=false;state.editingAppt=null;state.formAppt={client:'',service:state.services[0]?state.services[0].name:'',prof:'',time:'09:00',date:state.selectedDate,value:''};render()}
function closeModal(e){if(e&&e.target!==e.currentTarget)return;state.showModal=false;state.stepModal=false;state.editingAppt=null;render()}
function formAppt(f,v){state.formAppt[f]=v}
function editAppt(id){
  const a=state.appointments.find(x=>x.id===id)
  if(!a)return
  state.editingAppt=a;state.stepModal=false;state.showModal=true
  state.formAppt={client:a.client,service:a.service,prof:a.prof||'',time:a.time,date:a.date,value:a.value.toString()};render()
}
function saveEditAppt(){
  const f=state.formAppt,e=state.editingAppt
  if(!f.client||!f.value)return toast('Preencha todos os campos')
  state.appointments=state.appointments.map(a=>a.id===e.id?{...a,...f,value:parseFloat(f.value)}:a)
  save();state.showModal=false;state.editingAppt=null;toast('Atualizado!');render()
}
function deleteAppt(id){
  if(!confirm('Excluir agendamento?'))return
  state.appointments=state.appointments.filter(a=>a.id!==id);save();toast('Excluido!');render()
}
function updateStatus(id,st){
  state.appointments=state.appointments.map(a=>a.id===id?{...a,status:st}:a);save()
  if(st==='concluido'){
    const a=state.appointments.find(x=>x.id===id)
    if(a&&!state.transactions.find(t=>t.desc.includes(a.client)&&t.desc.includes(a.service)))
      state.transactions.push({id:Date.now(),desc:`${a.service} — ${a.client}`,type:'entrada',value:a.value,date:a.date,cat:'Servico'})
    save()
  }
  render()
}

/* CLIENTS */
function searchClient(v){state.clientSearch=v;render()}
function setClientFilter(f){state.clientFilter=f;render()}
function setClientSort(s){state.clientSort=s;render()}
function viewClient(name){

}

function openClientModal(cl){
  state.showClientModal=true
  state.editingClient=cl||null
  state.formClient=cl?{name:cl.name,phone:cl.phone||'',whatsapp:cl.whatsapp||'',birth:cl.birth||'',notes:cl.notes||'',active:cl.active!==false}:{name:'',phone:'',whatsapp:'',birth:'',notes:'',active:true}
  render()
}
function closeClientModal(e){if(e&&e.target!==e.currentTarget)return;state.showClientModal=false;state.editingClient=null;render()}
function formClient(f,v){state.formClient[f]=v}
function saveClient(){
  const f=state.formClient
  if(!f.name)return toast('Digite o nome do cliente')
  if(state.editingClient){
    state.clients=state.clients.map(c=>c.id===state.editingClient.id?{...c,name:f.name,phone:f.phone,whatsapp:f.whatsapp,birth:f.birth,notes:f.notes,active:f.active}:c)
  }else{
    if(state.clients.find(c=>c.name===f.name))return toast('Cliente ja existe')
    state.clients.push({id:Date.now(),name:f.name,phone:f.phone,whatsapp:f.whatsapp,birth:f.birth,notes:f.notes,active:f.active,createdAt:today()})
  }
  save();state.showClientModal=false;state.editingClient=null;toast('Cliente salvo!');render()
}
function editClientByName(name){
  const cl=state.clients.find(c=>c.name===name)
  openClientModal(cl||{name,phone:'',whatsapp:'',birth:'',notes:'',active:true})
}
function deleteClient(name){
  if(!confirm('Excluir cliente "'+name+'"? Os agendamentos serao mantidos.'))return
  state.clients=state.clients.filter(c=>c.name!==name);save();toast('Cliente removido');goBack();render()
}
function startBookingFromClient(name){
  state.stepModal=true;state.step=1;state.editingAppt=null
  state.formAppt={client:name,service:state.services[0]?state.services[0].name:'',prof:'',time:'09:00',date:today(),value:''}
  state.subtab=null;state.clientDetail=null;state.tab='agenda'
  render()
  setTimeout(()=>{state.step=3;render()},100)
}

function exportClientCSV(){
  syncClients()
  const rows=[['Nome','Telefone','WhatsApp','Nascimento','Visitas','Total Gasto','Ultima Visita','Observacoes']]
  state.clients.forEach(c=>{
    const info=getClientInfo(c.name)
    rows.push([c.name,c.phone||'',c.whatsapp||'',c.birth||'',info.apps.length,info.total,info.lastAppt?info.lastAppt.date:'',c.notes||''])
  })
  const csv=rows.map(r=>r.map(v=>'"'+(v||'').toString().replace(/"/g,'""')+'"').join(',')).join('\n')
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'})
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='clientes-'+today()+'.csv';a.click()
  toast('CSV exportado!')
}
function exportClientWhatsApp(){
  syncClients()
  const nums=[...new Set(state.clients.filter(c=>c.whatsapp||c.phone).map(c=>'55'+(c.whatsapp||c.phone).replace(/[^0-9]/g,'')))]
  if(!nums.length)return toast('Nenhum contato com WhatsApp')
  const text=encodeURIComponent('Oi! Passando pra avisar que temos horarios disponiveis no Martins MegaHair essa semana. Me chama pra reservar! 💇‍♀️')
  window.open('https://wa.me/?text='+text,'_blank')
  toast(nums.length+' contatos copiados para lista de transmissao')
}

/* NOTIFICATIONS */
function toggleNotif(){
  if(state.notifEnabled){
    state.notifEnabled=false;save();render();return
  }
  if(!('Notification'in window)){toast('Notificacoes nao suportadas');return}
  if(Notification.permission==='granted'){state.notifEnabled=true;save();render();toast('Notificacoes ativadas!');return}
  if(Notification.permission==='denied'){toast('Notificacoes bloqueadas no navegador');return}
  Notification.requestPermission().then(p=>{
    if(p==='granted'){state.notifEnabled=true;save();render();toast('Notificacoes ativadas!')}
    else toast('Permissao negada')
  })
}

/* DATA */
function clearData(){
  if(!confirm('Tem certeza? Todos os dados serao perdidos!'))return
  const d=[...state.services],p=[...state.pros]
  state.appointments=[];state.transactions=[]
  localStorage.removeItem('appts');localStorage.removeItem('trans');save();toast('Dados limpos!');render()
}

/* TOAST */
function toast(msg){state.toast=msg;render();setTimeout(()=>{state.toast=null;render()},2000)}

/* SW */
if('serviceWorker'in navigator){
  const swCode='self.addEventListener("install",e=>{self.skipWaiting()});self.addEventListener("fetch",e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request)))})'
  const blob=new Blob([swCode],{type:'application/javascript'})
  const url=URL.createObjectURL(blob)
  navigator.serviceWorker.register(url).catch(()=>{})
}

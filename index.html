<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" id="theme-color" content="#fdf6ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="data:application/json,{}" id="manifest-link">
<title>Martins MegaHair</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--gold:#b8860b;--gold-light:#d4a017;--dark:#1a0e08;--dark2:#2d1810;--rose:#fdf6ee;--rose2:#f5ede0;--text:#8a7a6a;--green:#8cc9a0;--red:#c97a7a;--pink:#e0a0c0;--bg:#fdf6ee;--card:#fff;--card-border:#e8dcc8;--input-bg:#fdf6ee;--shadow:rgba(201,168,76,.1);--text-primary:#1a0e08;--text-secondary:#4a3020;--sec-bg:#faf3e8;--sec-border:rgba(184,134,11,.12);--ter-bg:#f6ede0;--tab-bg:#fff}
.dark{--gold:#c9a84c;--gold-light:#e8c97a;--dark:#0e0a0c;--dark2:#1a1118;--rose:#231620;--rose2:#2a1c24;--text:#f0e8d8;--bg:#0e0a0c;--card:#1a1118;--card-border:#231620;--input-bg:#231620;--shadow:rgba(0,0,0,.4);--text-primary:#f0e8d8;--text-secondary:#d4c8b8;--sec-bg:#231620;--sec-border:rgba(201,168,76,.12);--ter-bg:#1a1118;--tab-bg:#1a1118}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text-primary);overflow-x:hidden;transition:background .3s,color .3s}
input,select,button,textarea{font-family:inherit;font-size:inherit}
.header{background:linear-gradient(160deg,var(--dark),var(--dark2));padding:12px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.25)}
.header-brand{display:flex;align-items:center;gap:8px}
.header-logo{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-light));display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.header-title{color:var(--gold);font-size:14px;font-weight:700;font-style:italic}
.header-actions{display:flex;gap:6px;align-items:center}
.header-btn{background:linear-gradient(135deg,var(--gold),var(--gold-light));border:none;border-radius:8px;color:var(--dark);padding:7px 12px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap}
.icon-btn{background:none;border:none;cursor:pointer;color:rgba(255,220,200,.6);padding:6px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.icon-btn:hover{color:var(--gold)}
.tabbar{display:flex;background:var(--tab-bg);padding:5px 4px;position:sticky;top:56px;z-index:99;box-shadow:0 1px 8px var(--shadow);justify-content:space-around;transition:background .3s}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 8px;border-radius:8px;border:none;cursor:pointer;background:transparent;color:var(--text);font-size:9px;font-weight:600;width:100%;transition:all .2s}
.tabbar .active{background:linear-gradient(135deg,#c9a84c22,#c9a84c11);color:var(--gold)}
.tabbar svg{width:20px;height:20px}
.main{padding:12px 12px 80px;max-width:500px;margin:0 auto}
.page-title{font-size:18px;color:var(--text-primary);font-weight:400;margin-bottom:12px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.kpi-card{background:var(--card);border-radius:12px;padding:12px;box-shadow:0 1px 8px var(--shadow);border-top:3px solid var(--gold);transition:background .3s}
.kpi-label{color:var(--text);font-size:9px;text-transform:uppercase;margin-bottom:3px;font-weight:600;letter-spacing:.3px}
.kpi-value{font-size:18px;font-weight:700;color:var(--text-primary)}
.card{background:var(--card);border-radius:12px;padding:14px;box-shadow:0 1px 8px var(--shadow);margin-bottom:12px;transition:background .3s}
.card-title{font-size:14px;font-weight:600;color:var(--text-primary);margin-bottom:10px}
.appt-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--card-border);transition:border-color .3s}
.appt-item:last-child{border-bottom:none}
.appt-time{width:44px;text-align:center;flex-shrink:0}
.appt-time .t{font-size:13px;font-weight:700;color:var(--text-primary)}
.appt-info{flex:1;min-width:0}
.appt-info .name{font-size:12px;font-weight:600;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appt-info .service{font-size:10px;color:var(--text)}
.appt-status{font-size:8px;padding:2px 8px;border-radius:10px;font-weight:700;text-transform:uppercase;border:none;cursor:pointer;flex-shrink:0}
.cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cal-header button{background:none;border:none;cursor:pointer;color:var(--text);padding:4px;border-radius:6px}
.cal-header span{font-size:13px;font-weight:600;color:var(--text-primary)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;text-align:center}
.cal-day-header{font-size:8px;color:var(--text);padding:3px 0;font-weight:600}
.cal-day{aspect-ratio:1;border-radius:50%;border:none;cursor:pointer;font-size:11px;background:transparent;color:var(--text-primary);font-weight:400;position:relative;display:flex;align-items:center;justify-content:center;padding:0}
.cal-day.selected{background:linear-gradient(135deg,var(--gold),var(--gold-light));color:var(--dark);font-weight:700}
.cal-day .dot{position:absolute;bottom:1px;left:50%;transform:translateX(-50%);width:3px;height:3px;border-radius:50%;background:var(--gold)}
.fin-summary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.fin-card{background:var(--card);border-radius:10px;padding:10px;box-shadow:0 1px 8px var(--shadow);transition:background .3s}
.fin-label{font-size:8px;color:var(--text);text-transform:uppercase;font-weight:600;margin-bottom:2px}
.fin-value{font-size:14px;font-weight:700}
.fin-green{color:var(--green)}.fin-red{color:var(--red)}.fin-gold{color:var(--gold)}
.filter-bar{display:flex;gap:5px;margin-bottom:10px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.filter-btn{padding:5px 12px;border-radius:16px;border:1px solid var(--card-border);font-size:10px;cursor:pointer;font-weight:600;background:var(--card);color:var(--text);white-space:nowrap;transition:all .2s}
.filter-btn.active{background:var(--gold);color:var(--bg);border-color:var(--gold)}
.trans-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--card-border)}
.trans-item:last-child{border:none}
.trans-desc{font-size:12px;color:var(--text-secondary)}
.trans-meta{font-size:9px;color:var(--text);margin-top:1px}
.trans-value{font-weight:700;font-size:13px}
.client-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.client-card{border-radius:10px;border:1px solid var(--card-border);padding:12px;background:var(--card);cursor:pointer;transition:all .2s}
.client-card:active{transform:scale(.97)}
.client-avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--text-primary);margin-bottom:6px}
.client-name{font-size:12px;font-weight:700;color:var(--text-primary);margin-bottom:3px}
.client-stats{display:flex;justify-content:space-between;font-size:9px}
.client-stats span:first-child{color:var(--text)}
.client-stats span:last-child{color:var(--gold);font-weight:700}
.search-box{position:relative;margin-bottom:10px}
.search-box input{width:100%;padding:9px 10px 9px 32px;border-radius:8px;border:1px solid var(--card-border);font-size:12px;outline:none;color:var(--text-primary);background:var(--input-bg);box-sizing:border-box;transition:border-color .3s}
.search-box input:focus{border-color:var(--gold)}
.search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text);pointer-events:none}
.btn-primary{width:100%;background:linear-gradient(135deg,var(--gold),var(--gold-light));border:none;border-radius:10px;color:var(--dark);padding:12px;font-size:13px;font-weight:700;cursor:pointer;margin-bottom:12px;transition:opacity .2s}
.btn-primary:active{opacity:.8}
.btn-primary:disabled{opacity:.5;cursor:default}
.btn-secondary{flex:1;padding:11px;border-radius:8px;border:1px solid var(--card-border);background:var(--card);color:var(--text);font-size:13px;cursor:pointer;font-weight:600;transition:background .3s}
.shortcuts-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.shortcut-primary{grid-column:1/-1;display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,var(--gold),var(--gold-light));border:none;border-radius:14px;color:var(--dark);padding:16px 18px;cursor:pointer;text-align:left;width:100%;box-shadow:0 4px 16px rgba(201,168,76,.35);transition:transform .15s;position:relative;overflow:hidden}
.shortcut-primary:active{transform:scale(.97)}
.shortcut-primary .s-icon{width:42px;height:42px;border-radius:12px;background:rgba(0,0,0,.1);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.shortcut-primary .s-text{flex:1}
.shortcut-primary .s-label{font-size:15px;font-weight:800}
.shortcut-primary .s-hint{font-size:11px;opacity:.7;margin-top:2px}
.shortcut-primary .s-arrow{font-size:18px;opacity:.6}
.shortcut-primary::after{content:'';position:absolute;top:0;left:-50%;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);transform:skewX(-25deg);transition:left .4s}
.shortcut-primary:active::after{left:150%}
.shortcut-secondary{display:flex;flex-direction:column;align-items:flex-start;gap:6px;background:var(--sec-bg);border:1px solid var(--sec-border);border-radius:12px;padding:14px;cursor:pointer;text-align:left;transition:transform .15s,background .3s,border-color .3s;position:relative;overflow:hidden}
.shortcut-secondary:active{transform:scale(.97)}
.shortcut-secondary::after{content:'';position:absolute;top:0;left:-50%;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.04),transparent);transform:skewX(-25deg);transition:left .4s}
.shortcut-secondary:active::after{left:150%}
.shortcut-secondary .s-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.shortcut-secondary .s-label{font-size:13px;font-weight:700;color:var(--text-primary)}
.shortcut-secondary .s-hint{font-size:9px;color:var(--text);line-height:1.3}
.shortcut-tertiary{display:flex;align-items:center;gap:12px;background:var(--ter-bg);border:none;border-radius:12px;padding:12px;cursor:pointer;text-align:left;transition:transform .15s,background .3s;position:relative;overflow:hidden}
.shortcut-tertiary:active{transform:scale(.97)}
.shortcut-tertiary::after{content:'';position:absolute;top:0;left:-50%;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.03),transparent);transform:skewX(-25deg);transition:left .4s}
.shortcut-tertiary:active::after{left:150%}
.shortcut-tertiary .s-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.shortcut-tertiary .s-text{flex:1}
.shortcut-tertiary .s-label{font-size:12px;font-weight:700;color:var(--text-primary)}
.shortcut-tertiary .s-hint{font-size:9px;color:var(--text);margin-top:1px}
.btn-gold{flex:1;padding:11px;border-radius:8px;border:none;background:linear-gradient(135deg,var(--gold),var(--gold-light));color:var(--dark);font-size:13px;font-weight:700;cursor:pointer}
.btn-gold:active{opacity:.8}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;z-index:200;animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-content{background:var(--card);border-radius:16px 16px 0 0;padding:20px 16px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 -10px 40px rgba(0,0,0,.2);transition:background .3s}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.modal-header h3{font-size:16px;color:var(--text-primary);font-style:italic}
.modal-close{background:none;border:none;cursor:pointer;color:var(--text);padding:4px;border-radius:6px}
.form-group{margin-bottom:12px}
.form-group label{font-size:10px;color:var(--text);font-weight:600;text-transform:uppercase;display:block;margin-bottom:4px;letter-spacing:.3px}
.form-group input,.form-group select{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--card-border);font-size:13px;outline:none;color:var(--text-primary);background:var(--input-bg);box-sizing:border-box;transition:border-color .3s,background .3s,color .3s}
.form-group input:focus,.form-group select:focus{border-color:var(--gold)}
.form-row{display:flex;gap:8px}
.form-row .form-group{flex:1}
.type-toggle{display:flex;gap:6px;margin-bottom:12px}
.type-btn{flex:1;padding:9px;border-radius:8px;border:2px solid var(--card-border);font-size:11px;font-weight:600;cursor:pointer;text-align:center;transition:all .2s}
.type-btn.active{background:var(--green);color:#fff;border-color:var(--green)}
.type-btn.red.active{background:var(--red);border-color:var(--red);color:#fff}
.empty-state{text-align:center;padding:30px 0;color:var(--text)}
.empty-state .icon{font-size:36px;margin-bottom:6px}
.empty-state .msg{font-size:12px}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:8px 18px;border-radius:8px;font-size:12px;z-index:300;animation:fadeIn .3s ease;box-shadow:0 4px 20px rgba(0,0,0,.3)}
@keyframes fadeIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.spinner{width:18px;height:18px;border:2px solid var(--card-border);border-top-color:var(--gold);border-radius:50%;animation:spin .6s linear infinite;display:inline-block;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.steps{display:flex;gap:4px;margin-bottom:14px;justify-content:center}
.step{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;transition:all .2s}
.step.active{background:var(--gold);color:var(--dark)}
.step.done{background:var(--green);color:#fff}
.step.pending{background:var(--card-border);color:var(--text)}
.step-line{width:20px;height:2px;align-self:center;background:var(--card-border);transition:background .2s}
.step-line.done{background:var(--green)}
.hidden{display:none}
.flex{display:flex}.flex-1{flex:1}.gap-6{gap:6px}.gap-8{gap:8px}
.mb-8{margin-bottom:8px}.mb-12{margin-bottom:12px}
.text-center{text-align:center}
.w-100{width:100%}
.service-chip{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:16px;border:1px solid var(--card-border);background:var(--card);font-size:11px;cursor:pointer;margin:3px;transition:all .2s}
.service-chip.active{background:linear-gradient(135deg,var(--gold),var(--gold-light));color:var(--dark);border-color:var(--gold)}
.service-chip .del{color:var(--red);font-weight:700;margin-left:4px;cursor:pointer}
.badge{display:inline-block;padding:1px 6px;border-radius:8px;font-size:8px;font-weight:700;margin-left:4px;vertical-align:middle}
.badge-green{background:var(--green);color:#fff}
.badge-red{background:var(--red);color:#fff}
.toggle-wrap{display:flex;align-items:center;gap:8px}
.toggle{width:40px;height:22px;background:var(--card-border);border-radius:11px;position:relative;cursor:pointer;border:none;padding:0;transition:background .2s}
.toggle.on{background:var(--gold)}
.toggle .knob{width:18px;height:18px;background:#fff;border-radius:50%;position:absolute;top:2px;left:2px;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on .knob{transform:translateX(18px)}
.client-list{display:flex;flex-direction:column;gap:8px}
.client-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--card-border);background:var(--card);cursor:pointer;transition:all .15s;position:relative}
.client-row:active{transform:scale(.98)}
.client-row .ca{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--text-primary);flex-shrink:0}
.client-row .ci{flex:1;min-width:0}
.client-row .ci .cn{font-size:13px;font-weight:700;color:var(--text-primary)}
.client-row .ci .cs{font-size:10px;color:var(--text);margin-top:1px}
.client-row .ct{text-align:right;flex-shrink:0}
.client-row .ct .cv{font-size:13px;font-weight:700;color:var(--gold)}
.client-row .ct .cd{font-size:9px;color:var(--text)}
.client-badge{display:inline-block;padding:2px 7px;border-radius:8px;font-size:8px;font-weight:700;margin-left:6px;vertical-align:middle}
.client-badge.gold{background:var(--gold);color:var(--dark)}
.client-badge.green{background:var(--green);color:#fff}
.client-badge.pink{background:var(--pink);color:#fff}
.client-badge.blue{background:#a0c0e0;color:var(--text-primary)}
.client-header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.client-header .cha{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:var(--text-primary);flex-shrink:0}
.client-header .chd{flex:1}
.client-header .chd .chn{font-size:17px;font-weight:700;color:var(--text-primary)}
.client-header .chd .chm{font-size:11px;color:var(--text);margin-top:2px}
.client-actions{display:flex;gap:6px;margin-bottom:12px}
.client-actions button{flex:1;padding:8px;border-radius:8px;border:none;font-size:11px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px}
.client-action-primary{background:linear-gradient(135deg,var(--gold),var(--gold-light));color:var(--dark)}
.client-action-secondary{background:var(--card);border:1px solid var(--card-border)!important;color:var(--text)}
.client-action-danger{background:rgba(201,122,122,.15);color:var(--red)}
.sort-bar{display:flex;gap:4px;margin-bottom:10px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.sort-btn{padding:5px 10px;border-radius:14px;border:1px solid var(--card-border);font-size:9px;cursor:pointer;font-weight:600;background:var(--card);color:var(--text);white-space:nowrap;transition:all .2s}
.sort-btn.active{background:var(--gold);color:var(--dark);border-color:var(--gold)}
.client-count{font-size:11px;color:var(--text);margin-bottom:8px;padding:0 2px}
.service-tag{display:inline-block;padding:2px 8px;border-radius:10px;background:rgba(201,168,76,.12);color:var(--gold);font-size:9px;font-weight:600;margin:2px}
.config-row{display:flex;align-items:center;gap:8px;padding:6px 0}
.config-label{font-size:11px;color:var(--text);flex-shrink:0;min-width:80px}
.config-input{background:var(--input-bg);border:1px solid var(--card-border);border-radius:6px;padding:6px 8px;font-size:12px;color:var(--text-primary);outline:none;flex:1;min-width:0}
.config-input:focus{border-color:var(--gold)}
.chip{display:inline-block;padding:5px 10px;border-radius:14px;font-size:10px;font-weight:600;cursor:pointer;border:1px solid var(--card-border);background:var(--card);color:var(--text);transition:all .2s;user-select:none}
.chip.active{background:var(--gold);color:var(--dark);border-color:var(--gold)}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.dash-card{background:var(--card);border:1px solid var(--card-border);border-radius:10px;padding:10px;display:flex;align-items:center;gap:8px}
.dash-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.dash-info{flex:1;min-width:0}
.dash-val{font-size:14px;font-weight:700;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dash-lbl{font-size:9px;color:var(--text);margin-top:1px}
.shortcuts-grid-dash{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.shortcut-dash{background:var(--card);border:1px solid var(--card-border);border-radius:10px;padding:10px;display:flex;align-items:center;gap:8px;cursor:pointer;transition:all .2s;font-size:11px;color:var(--text-primary);font-weight:600}
.shortcut-dash:active{transform:scale(.97)}
.sd-icon{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sem-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sem-item{background:var(--rose2);border-radius:8px;padding:10px;text-align:center}
.sem-val{font-size:15px;font-weight:700;color:var(--text-primary)}
.sem-lbl{font-size:9px;color:var(--text);margin-top:2px}
.agenda-header{display:flex;align-items:center;gap:8px;padding:4px 0 8px}
.agenda-date{font-size:14px;font-weight:700;color:var(--text-primary)}
.agenda-hoje{padding:4px 10px;border-radius:12px;border:1px solid var(--gold);background:none;color:var(--gold);font-size:10px;font-weight:700;cursor:pointer;margin-left:auto;white-space:nowrap}
.agenda-search{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--card-border);background:var(--input-bg);color:var(--text-primary);font-size:12px;outline:none;box-sizing:border-box}
.agenda-search:focus{border-color:var(--gold)}
.fin-views{display:flex;gap:4px;margin-bottom:8px}
.trans-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.cli-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;transition:all .2s;margin-bottom:4px}
.cli-row:active{background:var(--rose2)}
.cli-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-light));display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--dark);flex-shrink:0}
.cli-info{flex:1;min-width:0}
.cli-name{font-size:12px;font-weight:700;color:var(--text-primary)}
.cli-meta{font-size:9px;color:var(--text);margin-top:1px}
.cli-ver{font-size:9px;color:var(--gold);font-weight:600;display:flex;align-items:center;gap:2px;flex-shrink:0}
.his-row{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--card-border)}
.his-row:last-child{border:none}
.his-date{font-size:10px;font-weight:700;color:var(--text);width:34px;flex-shrink:0}
.his-info{flex:1;min-width:0}
.his-svc{font-size:11px;font-weight:600;color:var(--text-primary)}
.his-time{font-size:9px;color:var(--text);margin-top:1px}
.his-price{font-size:11px;font-weight:700;color:var(--gold);flex-shrink:0}
.agenda-views{display:flex;gap:4px;margin:6px 0 10px}
.agenda-view-btn{padding:5px 14px;border-radius:14px;border:1px solid var(--card-border);background:var(--card);color:var(--text);font-size:10px;font-weight:600;cursor:pointer;transition:all .2s}
.agenda-view-btn.active{background:var(--gold);color:var(--dark);border-color:var(--gold)}
.agenda-timeline{display:flex;flex-direction:column;gap:2px}
.agenda-slot{display:flex;gap:8px;min-height:44px}
.agenda-time{width:36px;flex-shrink:0;text-align:center;font-size:9px;font-weight:700;color:var(--text-primary);padding-top:4px;line-height:1.2}
.agenda-slot-body{flex:1;display:flex;flex-direction:column;gap:4px;padding-left:8px;border-left:2px solid var(--card-border);position:relative;min-height:44px}
.agenda-slot.has-appt .agenda-slot-body{border-left-color:var(--gold)}
.agenda-card{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:8px;border:1px solid var(--card-border);background:var(--card);cursor:pointer;transition:all .2s}
.agenda-card.sel,.agenda-card:active{border-color:var(--gold)}
.agenda-card .ac-indicator{width:3px;height:24px;border-radius:2px;flex-shrink:0}
.agenda-card .ac-body{flex:1;min-width:0}
.agenda-card .ac-name{font-size:12px;font-weight:700;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agenda-card .ac-svc{font-size:9px;color:var(--text);margin-top:1px}
.agenda-card .ac-price{font-size:11px;font-weight:700;color:var(--gold);flex-shrink:0}
.agenda-card .ac-status{font-size:8px;padding:2px 6px;border-radius:8px;font-weight:600;flex-shrink:0}
.agenda-free{padding:10px 8px;font-size:10px;color:var(--text);font-style:italic}
.agenda-actions{background:var(--card);border:1px solid var(--card-border);border-radius:10px;padding:10px;margin:8px 0}
.act-btn{padding:6px 10px;border-radius:8px;border:1px solid var(--card-border);background:var(--card);color:var(--text-primary);font-size:10px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:4px}
.act-btn.act-green{border-color:var(--green);color:var(--green)}
.act-btn.act-red{border-color:var(--red);color:var(--red)}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $$ = s=>document.querySelector(s)
const DAYS = ['Dom','Seg','Ter','Qua','Qui','Sex','Sab']
const MONTHS = ['Janeiro','Fevereiro','Marco','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro']
const STATUS = {confirmado:'#c9a84c',pendente:'#e0a0c0',cancelado:'#bbb',concluido:'#7dc9a0'}

function today(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}

function load(key,fallback){try{const v=localStorage.getItem(key);return v?JSON.parse(v):fallback}catch{return fallback}}

let defServices = ['Corte','Coloracao','Hidratacao','Escova','Progressiva','Luzes','Manicure','Pedicure']
let state = {
  tab:'dashboard',subtab:null,selectedDate:today(),
  appointments:load('appts',[
    {id:1,client:'Ana Paula',service:'Coloracao',time:'09:00',date:'2026-05-20',status:'confirmado',value:180,prof:''},
    {id:2,client:'Carla Mendes',service:'Escova',time:'11:30',date:'2026-05-20',status:'concluido',value:80,prof:''},
    {id:3,client:'Fernanda Lima',service:'Corte',time:'14:00',date:'2026-05-20',status:'confirmado',value:65,prof:''},
  ]),
  transactions:load('trans',[
    {id:1,desc:'Coloracao - Ana Paula',type:'entrada',value:180,date:'2026-05-19',cat:'Servico'},
    {id:2,desc:'Tinta L\'Oreal',type:'saida',value:95,date:'2026-05-17',cat:'Material'},
    {id:3,desc:'Aluguel salao',type:'saida',value:1200,date:'2026-05-10',cat:'Fixo'},
  ]),
  services:load('services',defServices.map((n,i)=>({id:i+1,name:n,price:i===0?65:i===1?180:i===2?90:i===3?80:i===4?280:i===5?220:i===6?45:60}))),
  pros:load('pros',[{id:1,name:'Camila'},{id:2,name:'Juliana'},{id:3,name:'Larissa'}]),
  calMonth:new Date().getMonth(),calYear:new Date().getFullYear(),
  clients:load('clients',[]),
  filterFin:'todos',clientSearch:'',clientFilter:'todos',clientSort:'nome',clientDetail:null,
  toast:null,loading:false,
  showModal:false,showTransModal:false,showClientModal:false,
  stepModal:false,step:1,totalSteps:3,
  editingAppt:null,editingClient:null,
  darkMode:load('darkMode',false),
  formAppt:{client:'',service:'',time:'09:00',date:today(),value:''},
  formTrans:{desc:'',type:'entrada',value:'',date:today(),cat:'Servico'},
  formClient:{name:'',phone:'',whatsapp:'',birth:'',notes:'',active:true},
  agendaView:'hoje',agendaSearch:'',showFreeSlots:true,agendaSelAppt:null,finView:'mes',
  notifEnabled:load('notifEnabled',false),
  config:load('config',{salonName:'Martins MegaHair',logo:'&#9986;',phone:'',address:'',openTime:'08:00',closeTime:'18:00',workingDays:[0,1,2,3,4,5,6],whatsapp:''})
}

function save(){localStorage.setItem('appts',JSON.stringify(state.appointments));localStorage.setItem('trans',JSON.stringify(state.transactions));localStorage.setItem('services',JSON.stringify(state.services));localStorage.setItem('pros',JSON.stringify(state.pros));localStorage.setItem('clients',JSON.stringify(state.clients));localStorage.setItem('darkMode',JSON.stringify(state.darkMode));localStorage.setItem('notifEnabled',JSON.stringify(state.notifEnabled));localStorage.setItem('config',JSON.stringify(state.config))}

function svg(path,size=16){return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${path}</svg>`}
const I={
  dash:svg('<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',20),
  cal:svg('<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',20),
  fin:svg('<line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',20),
  cli:svg('<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',20),
  servicos:svg('<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',20),
  plus:'<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
  x:'<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
  search:'<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
  left:'<polyline points="15 18 9 12 15 6"/>',
  right:'<polyline points="9 18 15 12 9 6"/>',
  edit:'<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>',
  trash:'<polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  arrowUp:'<line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>',
  arrowDown:'<line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 5 5 12"/>',
  moon:'<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>',
  sun:'<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>',
  bell:'<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>',
  check:'<polyline points="20 6 9 17 4 12"/>',
  back:'<line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
  clock:'<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
}

function render(){
  const s=state,m=dark()?'dark':''
  if(s.darkMode)document.documentElement.classList.add('dark')
  else document.documentElement.classList.remove('dark')
  document.querySelector('meta[name=theme-color]').content=s.darkMode?'#0e0a0c':'#fdf6ee'

  const app=$$('#app')
  const todayAppts=s.appointments.filter(a=>a.date===s.selectedDate).sort((a,b)=>a.time.localeCompare(b.time))
  const entradas=s.transactions.filter(t=>t.type==='entrada').reduce((x,t)=>x+t.value,0)
  const saidas=s.transactions.filter(t=>t.type==='saida').reduce((x,t)=>x+t.value,0)
  const lucro=entradas-saidas
  const apptDates=new Set(s.appointments.map(a=>a.date))
  const daysInMonth=new Date(s.calYear,s.calMonth+1,0).getDate()
  const firstDay=new Date(s.calYear,s.calMonth,1).getDay()
  const filteredTrans=s.transactions.filter(t=>s.filterFin==='todos'||t.type===s.filterFin)
  const allClients=[...new Set(s.appointments.map(a=>a.client))]
  const filteredClients=s.clientSearch?allClients.filter(c=>c.toLowerCase().includes(s.clientSearch.toLowerCase())):allClients
  const colors=['#e0a0c0','#c9a84c','#7dc9a0','#c97a7a','#a0c0e0','#c0a0e0','#e0c0a0','#a0e0c0']

  const navItems=[
    {id:'dashboard',label:'Inicio',icon:I.dash},
    {id:'agenda',label:'Agenda',icon:I.cal},
    {id:'financeiro',label:'Financas',icon:I.fin},
    {id:'clientes',label:'Clientes',icon:I.cli},
    {id:'config',label:'Config',icon:svg(I.settings,20)},
  ]

  const stepsHtml=s.stepModal?`
    <div class="steps">
      ${Array(s.totalSteps).fill().map((_,i)=>{
        const n=i+1;let cls='pending'
        if(n===s.step)cls='active'
        else if(n<s.step)cls='done'
        return `<div class="step ${cls}">${n<s.step?svg(I.check,12):n}</div>${i<s.totalSteps-1?`<div class="step-line${n<=s.step?' done':''}"></div>`:''}`
      }).join('')}
    </div>
  `:''

  app.innerHTML=`
<header class="header">
  <div class="header-brand">
    <div class="header-logo">${s.config.logo||'&#9986;'}</div>
    <span class="header-title">${s.config.salonName||'Martins MegaHair'}</span>
  </div>
  <div class="header-actions">
    <button class="icon-btn" onclick="toggleDark()" title="Modo escuro">${svg(s.darkMode?I.sun:I.moon,18)}</button>
    <button class="header-btn" onclick="startBooking()">${svg(I.plus,12)} Novo</button>
  </div>
</header>

<nav class="tabbar">
  ${navItems.map(n=>`<button onclick="setTab('${n.id}')" class="${s.tab===n.id?'active':''}">${n.icon}${n.label}</button>`).join('')}
</nav>

<main class="main">
  ${s.subtab==='clientDetail'?renderClientDetail(s,colors):
    s.tab==='dashboard'?renderDashboard(entradas,saidas,lucro,todayAppts,s):
    s.tab==='agenda'?renderAgenda(s,firstDay,daysInMonth,apptDates,todayAppts):
    s.tab==='financeiro'?renderFinance(entradas,saidas,lucro,filteredTrans,s.filterFin):
    s.tab==='clientes'?renderClients(s.clientSearch,filteredClients,s.appointments,colors,s):
    s.tab==='config'?renderConfig(s):
    ''}
</main>

${s.toast?`<div class="toast">${s.toast}</div>`:''}
${s.showModal||s.stepModal?renderApptModal(s,stepsHtml):''}
${s.showTransModal?renderTransModal(s):''}
${s.showClientModal?renderClientModal(s):''}
`}

function dark(){return state.darkMode}
function toggleDark(){state.darkMode=!state.darkMode;save();render()}

function renderDashboard(entradas,saidas,lucro,todayAppts,s){
  const h=new Date().getHours()
  const greet=h<12?'Bom dia':h<18?'Boa tarde':'Boa noite'
  const hojeRev=todayAppts.reduce((x,a)=>x+(a.status==='cancelado'?0:a.value),0)
  const hojeCli=new Set(todayAppts.filter(a=>a.status!=='cancelado').map(a=>a.client)).size
  const prox=todayAppts.filter(a=>a.status!=='cancelado'&&a.time>=today().slice(0,10)?'00:00':a.time).sort((a,b)=>a.time.localeCompare(b.time))[0]
  const slots=['08:00','09:00','10:00','11:00','13:00','14:00','15:00','16:00','17:00','18:00']
  const booked=todayAppts.filter(a=>a.status!=='cancelado').map(a=>a.time)
  const livres=slots.filter(t=>!booked.includes(t)).length

  const now=new Date(),dow=now.getDay(),seg=new Date(now);seg.setDate(now.getDate()-(dow===0?6:dow-1))
  const dom=new Date(seg);dom.setDate(seg.getDate()+6)
  const wkApps=s.appointments.filter(a=>a.date>=seg.toISOString().slice(0,10)&&a.date<=dom.toISOString().slice(0,10))
  const wkRev=wkApps.reduce((x,a)=>x+(a.status==='cancelado'?0:a.value),0)
  const wkCli=new Set(wkApps.map(a=>a.client)).size
  const wkNew=s.clients.filter(c=>c.createdAt&&c.createdAt>=seg.toISOString().slice(0,10)&&c.createdAt<=dom.toISOString().slice(0,10)).length

  return`
    <div style="padding:6px 0 10px">
      <div style="font-size:15px;font-weight:700;color:var(--text-primary)">👋 ${greet}!</div>
      <div style="font-size:11px;color:var(--text);margin-top:2px">Hoje voce tem ${todayAppts.length} agendamento${todayAppts.length!==1?'s':''}</div>
    </div>

    <div class="dash-grid">
      <div class="dash-card"><div class="dash-icon" style="background:rgba(201,168,76,0.12);color:var(--gold)">📅</div><div class="dash-info"><div class="dash-val">${todayAppts.length}</div><div class="dash-lbl">Agendamentos</div></div></div>
      <div class="dash-card"><div class="dash-icon" style="background:rgba(124,201,160,0.12);color:var(--green)">💰</div><div class="dash-info"><div class="dash-val">R$ ${hojeRev}</div><div class="dash-lbl">Faturamento</div></div></div>
      <div class="dash-card"><div class="dash-icon" style="background:rgba(224,160,192,0.12);color:var(--pink)">👥</div><div class="dash-info"><div class="dash-val">${hojeCli}</div><div class="dash-lbl">Clientes</div></div></div>
      <div class="dash-card"><div class="dash-icon" style="background:rgba(160,192,224,0.12);color:#8ab">⏰</div><div class="dash-info"><div class="dash-val" style="font-size:13px">${prox?prox.time+' — '+prox.client:'---'}</div><div class="dash-lbl">Proximo</div></div></div>
    </div>

    <div class="card">
      <div class="card-title" style="margin-bottom:8px">Agenda do Dia</div>
      ${todayAppts.length===0?`<div class="empty-state"><div class="icon">&#128197;</div><div class="msg">Nenhum agendamento hoje</div><button class="btn-gold" onclick="startBooking()" style="margin-top:8px;padding:8px 20px;font-size:12px">${svg(I.plus,12)} Novo Agendamento</button></div>`:
        todayAppts.map(a=>`
          <div class="appt-item" onclick="editAppt(${a.id})" style="cursor:pointer">
            <div class="appt-time"><div class="t">${a.time}</div></div>
            <div class="appt-info"><div class="name">${a.client}</div><div class="service">${a.service}</div></div>
            <span class="appt-status" style="background:${STATUS[a.status]}33;color:${STATUS[a.status]}">${a.status}</span>
          </div>
        `).join('')}
      <button class="btn-primary" onclick="startBooking()" style="margin-top:8px">${svg(I.plus,12)} Novo Agendamento</button>
    </div>

    <div class="shortcuts-grid-dash">
      <button class="shortcut-dash" onclick="openClientModal()"><div class="sd-icon" style="background:rgba(224,160,192,0.12);color:var(--pink)">${svg(I.plus,16)}</div><span>Novo Cliente</span></button>
      <button class="shortcut-dash" onclick="setTab('agenda')"><div class="sd-icon" style="background:rgba(201,168,76,0.12);color:var(--gold)">${svg(I.cal,16)}</div><span>Abrir Agenda</span></button>
      <button class="shortcut-dash" onclick="openTransModal()"><div class="sd-icon" style="background:rgba(124,201,160,0.12);color:var(--green)">${svg(I.fin,16)}</div><span>Registrar Pagamento</span></button>
      <button class="shortcut-dash" onclick="setTab('config')"><div class="sd-icon" style="background:rgba(160,160,160,0.12);color:var(--text)">${svg(I.settings,16)}</div><span>Configurar</span></button>
    </div>

    <div class="card">
      <div class="card-title" style="margin-bottom:8px">Resumo da Semana</div>
      <div class="sem-grid">
        <div class="sem-item"><div class="sem-val">R$ ${wkRev}</div><div class="sem-lbl">Faturamento</div></div>
        <div class="sem-item"><div class="sem-val">${wkNew}</div><div class="sem-lbl">Novos Clientes</div></div>
        <div class="sem-item"><div class="sem-val">${wkApps.length}</div><div class="sem-lbl">Atendimentos</div></div>
        <div class="sem-item"><div class="sem-val">${livres}</div><div class="sem-lbl">Horarios Livres</div></div>
      </div>
    </div>
  `
}

function renderAgenda(s,firstDay,daysInMonth,apptDates,todayAppts){
  const cfg=s.config
  const [oh,om]=cfg.openTime.split(':').map(Number),[ch,cm]=cfg.closeTime.split(':').map(Number)
  const startMin=oh*60+om,endMin=ch*60+cm
  const slots=[]
  for(let m=startMin;m<endMin;m+=60){
    const sh=Math.floor(m/60),smin=m%60,eh=Math.floor((m+60)/60),emin=(m+60)%60
    slots.push({start:String(sh).padStart(2,'0')+':'+String(smin).padStart(2,'0'),end:String(eh).padStart(2,'0')+':'+String(emin).padStart(2,'0')})
  }
  const selDate=new Date(s.selectedDate+'T12:00:00')
  const dayName=DAYS[selDate.getDay()]
  const dateStr=s.selectedDate===today()?'Hoje':dayName+', '+selDate.getDate()+' '+MONTHS[selDate.getMonth()]
  const filtered=s.agendaSearch?todayAppts.filter(a=>a.client.toLowerCase().includes(s.agendaSearch.toLowerCase())||a.service.toLowerCase().includes(s.agendaSearch.toLowerCase())):todayAppts
  const isHoje=s.agendaView==='hoje'
  const nowStr=today().slice(0,10)==='2026-05-20'?'':today()  // adjust for demo

  /* Week view: collect all days */
  let weekHtml=''
  if(!isHoje){
    const dow=selDate.getDay(),seg=new Date(selDate);seg.setDate(selDate.getDate()-(dow===0?6:dow-1))
    for(let i=0;i<7;i++){
      const d=new Date(seg);d.setDate(seg.getDate()+i)
      const ds=d.toISOString().slice(0,10)
      const dayAppts=s.appointments.filter(a=>a.date===ds).sort((a,b)=>a.time.localeCompare(b.time))
      const label=ds===today()?'Hoje':DAYS[d.getDay()]+' '+d.getDate()
      weekHtml+=`<div style="margin-bottom:8px${i>0?';margin-top:12px':''}"><div style="font-size:11px;font-weight:700;color:var(--gold);margin-bottom:4px">${label}</div>${dayAppts.length?dayAppts.map(a=>`<div class="agenda-card" onclick="selAppt(${a.id})" style="${s.agendaSelAppt===a.id?'border-color:var(--gold)':''}"><div class="ac-time">${a.time}</div><div class="ac-body"><div class="ac-name">${a.client}</div><div class="ac-svc">${a.service}</div></div><div class="ac-price">R$ ${a.value}</div><span class="ac-status" style="background:${STATUS[a.status]}22;color:${STATUS[a.status]}">${a.status}</span></div>`).join(''):`<div style="font-size:11px;color:var(--text);padding:6px 0">Nenhum agendamento</div>`}</div>`
    }
  }

  return`
    <div class="agenda-header">
      <button onclick="prevDay()">${svg(I.left,14)}</button>
      <div><div class="agenda-date">${dateStr}</div><div style="font-size:9px;color:var(--text)">${todayAppts.length} agendamento${todayAppts.length!==1?'s':''}</div></div>
      <button onclick="nextDay()">${svg(I.right,14)}</button>
      <button class="agenda-hoje" onclick="goToday()">Hoje</button>
    </div>
    <div style="padding:4px 0"><input class="agenda-search" placeholder="Buscar cliente..." value="${s.agendaSearch}" oninput="setAgendaSearch(this.value)"></div>
    <div class="agenda-views"><button class="agenda-view-btn${isHoje?' active':''}" onclick="setAgendaView('hoje')">Hoje</button><button class="agenda-view-btn${!isHoje?' active':''}" onclick="setAgendaView('semana')">Semana</button></div>
    ${isHoje?`
      <div class="agenda-timeline">
        ${slots.map(sl=>{
          const apps=filtered.filter(a=>a.time>=sl.start&&a.time<sl.end)
          if(!apps.length&&!s.showFreeSlots)return''
          return`<div class="agenda-slot${apps.length?' has-appt':''}">
            <div class="agenda-time">${sl.start}<br><span style="font-weight:400;font-size:8px;color:var(--text)">${sl.end}</span></div>
            <div class="agenda-slot-body">
              ${apps.length?apps.map(a=>`
                <div class="agenda-card${s.agendaSelAppt===a.id?' sel':''}" onclick="selAppt(${a.id})">
                  <div class="ac-indicator" style="background:${STATUS[a.status]}"></div>
                  <div class="ac-body">
                    <div class="ac-name">${a.client}</div>
                    <div class="ac-svc">${a.service}</div>
                  </div>
                  <div class="ac-price">R$ ${a.value}</div>
                  <span class="ac-status" style="background:${STATUS[a.status]}22;color:${STATUS[a.status]}">${a.status}</span>
                </div>
              `).join(''):s.showFreeSlots?`<div class="agenda-free">Livre</div>`:''}
            </div>
          </div>`
        }).filter(Boolean).join('')}
      </div>
      <div style="display:flex;align-items:center;gap:6px;padding:4px 0 8px">
        <button class="toggle${s.showFreeSlots?' on':''}" onclick="toggleFreeSlots()" style="transform:scale(.8);transform-origin:left center"><span class="knob"></span></button>
        <span style="font-size:10px;color:var(--text)">Mostrar horarios livres</span>

    ${s.agendaSelAppt?schedActions(s.agendaSelAppt):''}
    <button class="btn-primary" onclick="startBooking()" style="margin-top:4px">${svg(I.plus,12)} Novo Agendamento</button>
  `
}

function renderFinance(entradas,saidas,lucro,filteredTrans,filterFin){
  const s=state,cfg=s.config
  const now=new Date()
  /* Determine period range */
  let periodStart,periodEnd,periodLabel
  if(s.finView==='hoje'){
    periodStart=periodEnd=today()
    periodLabel='Hoje'
  }else if(s.finView==='semana'){
    const dow=now.getDay(),seg=new Date(now);seg.setDate(now.getDate()-(dow===0?6:dow-1))
    periodStart=seg.toISOString().slice(0,10);periodEnd=new Date(seg);periodEnd.setDate(seg.getDate()+6);periodEnd=periodEnd.toISOString().slice(0,10)
    periodLabel='Esta semana'
  }else{
    periodStart=today().slice(0,7)+'-01'
    const last=new Date(now.getFullYear(),now.getMonth()+1,0)
    periodEnd=last.toISOString().slice(0,10)
    periodLabel=MONTHS[now.getMonth()]
  }

  const periodTrans=s.transactions.filter(t=>t.date>=periodStart&&t.date<=periodEnd)
  const periodEnt=periodTrans.filter(t=>t.type==='entrada').reduce((x,t)=>x+t.value,0)
  const periodSai=periodTrans.filter(t=>t.type==='saida').reduce((x,t)=>x+t.value,0)
  const periodLuc=periodEnt-periodSai

  /* Group transactions by date */
  const groups={}
  filteredTrans.forEach(t=>{
    const d=t.date;if(!groups[d])groups[d]=[]
    groups[d].push(t)
  })
  const sortedDates=Object.keys(groups).sort().reverse()

  return`
    <div class="fin-views"><button class="agenda-view-btn${s.finView==='hoje'?' active':''}" onclick="setFinView('hoje')">Hoje</button><button class="agenda-view-btn${s.finView==='semana'?' active':''}" onclick="setFinView('semana')">Semana</button><button class="agenda-view-btn${s.finView==='mes'?' active':''}" onclick="setFinView('mes')">Mes</button></div>

    <div class="fin-summary">
      <div class="fin-card"><div class="fin-label">Entradas</div><div class="fin-value fin-green">R$ ${periodEnt.toLocaleString('pt-BR')}</div></div>
      <div class="fin-card"><div class="fin-label">Saidas</div><div class="fin-value fin-red">R$ ${periodSai.toLocaleString('pt-BR')}</div></div>
      <div class="fin-card"><div class="fin-label">Saldo</div><div class="fin-value${periodLuc>=0?' fin-green':' fin-red'}">${periodLuc>=0?'+':'-'} R$ ${Math.abs(periodLuc).toLocaleString('pt-BR')}</div></div>
    </div>

    <div class="card">
      <div class="filter-bar">
        <button class="filter-btn${filterFin==='todos'?' active':''}" onclick="setFilter('todos')">Todos</button>
        <button class="filter-btn${filterFin==='entrada'?' active':''}" onclick="setFilter('entrada')">Entradas</button>
        <button class="filter-btn${filterFin==='saida'?' active':''}" onclick="setFilter('saida')">Saidas</button>
      </div>
      ${filteredTrans.length===0?`<div class="empty-state"><div class="icon">&#128176;</div><div class="msg">Nenhum lancamento</div></div>`:
        sortedDates.map(d=>`
          <div style="font-size:10px;font-weight:700;color:var(--text);margin:8px 0 4px">${d.split('-').reverse().join('/')}</div>
          ${groups[d].map(t=>`
            <div class="trans-item">
              <div class="trans-dot" style="background:${t.type==='entrada'?'var(--green)':'var(--red)'}"></div>
              <div><div class="trans-desc">${t.desc}</div><div class="trans-meta">${t.cat}</div></div>
              <span class="trans-value" style="color:${t.type==='entrada'?'var(--green)':'var(--red)'};margin-left:auto">${t.type==='entrada'?'+':'-'}R$ ${t.value.toLocaleString('pt-BR')}</span>
              <button onclick="deleteTrans(${t.id})" style="background:none;border:none;cursor:pointer;color:var(--red);padding:2px;flex-shrink:0">${svg(I.trash,11)}</button>
            </div>
          `).join('')}
        `).join('')}
    </div>

    <div style="display:flex;gap:6px;margin-bottom:8px">
      <button class="btn-primary" onclick="openTransModal('entrada')" style="flex:1;margin:0">${svg(I.plus,12)} Entrada</button>
      <button class="btn-secondary" onclick="openTransModal('saida')" style="flex:1;margin:0;background:rgba(201,122,122,.12);color:var(--red);border-color:var(--red)">${svg(I.plus,12)} Despesa</button>
    </div>

    <div class="card">
      <div class="card-title" style="margin-bottom:8px">Resumo — ${periodLabel}</div>
      <div class="sem-grid">
        <div class="sem-item"><div class="sem-val" style="color:var(--green)">R$ ${periodEnt}</div><div class="sem-lbl">Faturamento</div></div>
        <div class="sem-item"><div class="sem-val" style="color:var(--red)">R$ ${periodSai}</div><div class="sem-lbl">Despesas</div></div>
        <div class="sem-item"><div class="sem-val" style="color:var(--gold)">R$ ${periodLuc}</div><div class="sem-lbl">Lucro</div></div>
        <div class="sem-item"><div class="sem-val">${periodTrans.length}</div><div class="sem-lbl">Movimentacoes</div></div>
      </div>
    </div>
  `
}

function syncClients(){
  const names=[...new Set(state.appointments.map(a=>a.client))]
  names.forEach(n=>{if(!state.clients.find(c=>c.name===n))state.clients.push({id:Date.now()+Math.random()*1000|0,name:n,phone:'',whatsapp:'',birth:'',notes:'',active:true,createdAt:today()})})
  save()
}

function getClientInfo(name){
  const cl=state.clients.find(c=>c.name===name)
  const apps=state.appointments.filter(a=>a.client===name).sort((a,b)=>b.date.localeCompare(a.date))
  const total=apps.reduce((x,a)=>x+a.value,0)
  const favSvc={};apps.forEach(a=>{favSvc[a.service]=(favSvc[a.service]||0)+1})
  const fav=Object.keys(favSvc).sort((a,b)=>favSvc[b]-favSvc[a])[0]||''
  const lastAppt=apps[0]||null
  const nextAppt=state.appointments.filter(a=>a.client===name&&a.date>=today()&&a.status!=='cancelado'&&a.status!=='concluido').sort((a,b)=>a.date.localeCompare(b.date)||a.time.localeCompare(b.time))[0]||null
  const freq=apps.length>=3?'frequente':apps.length>=1?'novo':'inativo'
  const isBirthday=cl&&cl.birth?(new Date(cl.birth).getMonth()===new Date().getMonth()&&new Date(cl.birth).getDate()===new Date().getDate()):false
  return {cl,apps,total,fav,lastAppt,nextAppt,freq,isBirthday}
}

    <div class="form-group" style="margin-top:8px"><label>Data e horario</label></div>

      <div class="form-group"><input type="date" value="${s.formAppt.date}" oninput="formAppt('date',this.value)"></div>
      <div class="form-group"><input type="time" value="${s.formAppt.time}" oninput="formAppt('time',this.value)"></div>
    </div>
    <div style="margin-top:12px;display:flex;flex-wrap:wrap;gap:4px">
      ${['08:00','09:00','10:00','11:00','13:00','14:00','15:00','16:00','17:00','18:00'].map(t=>
        `<span class="service-chip${s.formAppt.time===t?' active':''}" onclick="formAppt('time','${t}');render()">${t}</span>`
      ).join('')}
    </div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn-secondary" onclick="prevStep()">Voltar</button>
      <button class="btn-gold" onclick="nextStep()">Prosseguir</button>
    </div>
  `
}

function step3(s){
  return`
    <div style="text-align:center;padding:10px 0">
      <div style="font-size:40px;margin-bottom:8px">&#9986;</div>
      <div style="font-size:16px;font-weight:700;color:var(--text-primary);margin-bottom:4px">${s.formAppt.client}</div>
      <div style="font-size:13px;color:var(--text);margin-bottom:2px">${s.formAppt.service}</div>
      <div style="font-size:13px;color:var(--text);margin-bottom:8px">${s.formAppt.date.split('-').reverse().join('/')} as ${s.formAppt.time}</div>
      <div style="font-size:20px;font-weight:700;color:var(--gold)">R$ ${s.formAppt.value||'0'}</div>
    </div>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="btn-secondary" onclick="prevStep()">Voltar</button>
      <button class="btn-gold" onclick="finishBooking()">Confirmar</button>
    </div>
  `
}

function renderTransModal(s){
  return`
    <div class="modal-overlay" onclick="closeTransModal(event)">
      <div class="modal-content">
        <div class="modal-header"><h3>${s.formTrans.type==='entrada'?'Nova Entrada':'Nova Despesa'}</h3><button class="modal-close" onclick="closeTransModal()">${svg(I.x,16)}</button></div>
        <div class="type-toggle">
          <div class="type-btn${s.formTrans.type==='entrada'?' active':''}" onclick="formTrans('type','entrada');render()">Entrada</div>
          <div class="type-btn red${s.formTrans.type==='saida'?' active':''}" onclick="formTrans('type','saida');render()">Saida</div>
        </div>
        <div class="form-group"><label>Descricao</label><input placeholder="Ex: Corte - Maria" value="${s.formTrans.desc}" oninput="formTrans('desc',this.value)"></div>
        <div class="form-row">
          <div class="form-group"><label>Valor (R$)</label><input type="number" placeholder="0" value="${s.formTrans.value}" oninput="formTrans('value',this.value)"></div>
          <div class="form-group"><label>Data</label><input type="date" value="${s.formTrans.date}" oninput="formTrans('date',this.value)"></div>
        </div>
        <div class="form-group"><label>Categoria</label><select onchange="formTrans('cat',this.value)">
          <option value="Servico" ${s.formTrans.cat==='Servico'?'selected':''}>Servico</option>
          <option value="Material" ${s.formTrans.cat==='Material'?'selected':''}>Material</option>
          <option value="Fixo" ${s.formTrans.cat==='Fixo'?'selected':''}>Fixo</option>
          <option value="Outros" ${s.formTrans.cat==='Outros'?'selected':''}>Outros</option>
        </select></div>
        <div style="display:flex;gap:8px"><button class="btn-secondary" onclick="closeTransModal()">Cancelar</button><button class="btn-gold" onclick="saveTrans()">Salvar</button></div>
      </div>
    </div>`
}

function renderClientModal(s){
  const isEdit=s.editingClient
  return`
    <div class="modal-overlay" onclick="closeClientModal(event)">
      <div class="modal-content">
        <div class="modal-header"><h3>${isEdit?'Editar':'Novo'} Cliente</h3><button class="modal-close" onclick="closeClientModal()">${svg(I.x,16)}</button></div>
        <div class="form-group"><label>Nome completo</label><input value="${s.formClient.name}" oninput="formClient('name',this.value)" placeholder="Nome da cliente"></div>
        <div class="form-row">
          <div class="form-group"><label>Telefone</label><input value="${s.formClient.phone}" oninput="formClient('phone',this.value)" placeholder="(11) 99999-9999" type="tel"></div>
          <div class="form-group"><label>WhatsApp</label><input value="${s.formClient.whatsapp}" oninput="formClient('whatsapp',this.value)" placeholder="(11) 99999-9999" type="tel"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Data de nascimento</label><input type="date" value="${s.formClient.birth}" oninput="formClient('birth',this.value)"></div>
          <div class="form-group"><label>Status</label><select onchange="formClient('active',this.value==='1')"><option value="1" ${s.formClient.active?'selected':''}>Ativo</option><option value="0" ${!s.formClient.active?'selected':''}>Inativo</option></select></div>
        </div>
        <div class="form-group"><label>Observacoes</label><textarea rows="3" style="width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--card-border);font-size:13px;outline:none;color:var(--text-primary);background:var(--input-bg);box-sizing:border-box;resize:none" oninput="formClient('notes',this.value)" placeholder="Ex: alergica a amonia, prefere hidratacao">${s.formClient.notes}</textarea></div>
        <div style="display:flex;gap:8px"><button class="btn-secondary" onclick="closeClientModal()">Cancelar</button><button class="btn-gold" onclick="saveClient()">${isEdit?'Salvar':'Adicionar'}</button></div>
      </div>
    </div>`
}

/* === ACTIONS === */
function setTab(t){state.tab=t;state.subtab=null;state.clientDetail=null;render()}
function selectDate(d){state.selectedDate=d;render()}
function prevMonth(){if(state.calMonth===0){state.calMonth=11;state.calYear--}else state.calMonth--;render()}
function nextMonth(){if(state.calMonth===11){state.calMonth=0;state.calYear++}else state.calMonth++;render()}

function openSettings(){state.tab='config';state.subtab=null;render()}
function prevDay(){const d=new Date(state.selectedDate+'T12:00:00');d.setDate(d.getDate()-1);state.selectedDate=d.toISOString().slice(0,10);render()}
function nextDay(){const d=new Date(state.selectedDate+'T12:00:00');d.setDate(d.getDate()+1);state.selectedDate=d.toISOString().slice(0,10);render()}
function goToday(){state.selectedDate=today();render()}
function setAgendaView(v){state.agendaView=v;state.agendaSelAppt=null;render()}
function setAgendaSearch(v){state.agendaSearch=v;render()}
function toggleFreeSlots(){state.showFreeSlots=!state.showFreeSlots;render()}
function selAppt(id){state.agendaSelAppt=state.agendaSelAppt===id?null:id;render()}
function quickStatus(id,st){state.appointments=state.appointments.map(a=>a.id===id?{...a,status:st}:a);save();if(st==='concluido'){const a=state.appointments.find(x=>x.id===id);if(a&&!state.transactions.find(t=>t.desc.includes(a.client)&&t.desc.includes(a.service)))state.transactions.push({id:Date.now(),desc:`${a.service} — ${a.client}`,type:'entrada',value:a.value,date:a.date,cat:'Servico'});save()}state.agendaSelAppt=null;render()}
/* BOOKING STEP */
function startBooking(){
  state.showModal=false;state.stepModal=true;state.step=1;state.editingAppt=null
  state.formAppt={client:'',service:'',time:'09:00',date:state.selectedDate,value:''}
  render()
}
function prevStep(){state.step--;render()}
function nextStep(){state.step++;render()}
function finishBooking(){
  const f=state.formAppt
  if(!f.client||!f.service||!f.value)return toast('Preencha todos os campos')
  state.appointments.push({id:Date.now(),client:f.client,service:f.service,prof:'',time:f.time,date:f.date,status:'pendente',value:parseFloat(f.value)})
  save();state.stepModal=false;toast('Agendamento criado!')
  if(state.notifEnabled&&'Notification'in window&&Notification.permission==='granted'){
    const d=new Date(f.date+'T'+f.time);const n=new Notification('Martins MegaHair',{body:`${f.client} — ${f.service} as ${f.time}`,icon:'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><text y="18" font-size="16">✂️</text></svg>'})
  }
  render()
}
function saveApptDirect(){
  const f=state.formAppt
  if(!f.client||!f.value||!f.service)return toast('Preencha todos os campos')
  state.appointments.push({id:Date.now(),client:f.client,service:f.service,prof:'',time:f.time,date:f.date,status:'pendente',value:parseFloat(f.value)})
  save();state.showModal=false;state.editingAppt=null;toast('Agendamento criado!');render()
}

function openModal(){state.showModal=true;state.stepModal=false;state.editingAppt=null;state.formAppt={client:'',service:'',time:'09:00',date:state.selectedDate,value:''};render()}
function closeModal(e){if(e&&e.target!==e.currentTarget)return;state.showModal=false;state.stepModal=false;state.editingAppt=null;state.loading=false;render()}
function formAppt(f,v){state.formAppt[f]=v}
function editAppt(id){
  const a=state.appointments.find(x=>x.id===id)
  if(!a)return
  state.editingAppt=a;state.stepModal=false;state.showModal=true
  state.formAppt={client:a.client,service:a.service,time:a.time,date:a.date,value:a.value.toString()};render()
}
function saveEditAppt(){
  const f=state.formAppt,e=state.editingAppt
  if(!f.client||!f.value)return toast('Preencha todos os campos')
  state.appointments=state.appointments.map(a=>a.id===e.id?{...a,...f,value:parseFloat(f.value)}:a)
  save();state.showModal=false;state.editingAppt=null;toast('Atualizado!');render()
}
function deleteAppt(id){
  if(!confirm('Excluir agendamento?'))return
  state.appointments=state.appointments.filter(a=>a.id!==id);save();toast('Excluido!');render()
}
function updateStatus(id,st){
  state.appointments=state.appointments.map(a=>a.id===id?{...a,status:st}:a);save()
  if(st==='concluido'){
    const a=state.appointments.find(x=>x.id===id)
    if(a&&!state.transactions.find(t=>t.desc.includes(a.client)&&t.desc.includes(a.service)))
      state.transactions.push({id:Date.now(),desc:`${a.service} — ${a.client}`,type:'entrada',value:a.value,date:a.date,cat:'Servico'})
    save()
  }
  render()
}

/* FINANCE */
function setFilter(f){state.filterFin=f;render()}
function setFinView(v){state.finView=v;render()}
function openTransModal(type){
  state.showTransModal=true
  state.formTrans={desc:'',type:type||'entrada',value:'',date:today(),cat:type==='saida'?'Material':'Servico'}
  render()
}
function closeTransModal(e){if(e&&e.target!==e.currentTarget)return;state.showTransModal=false;render()}
function formTrans(f,v){state.formTrans[f]=v;render()}
function saveTrans(){
  const f=state.formTrans
  if(!f.desc||!f.value)return toast('Preencha todos os campos')
  state.transactions.push({id:Date.now(),desc:f.desc,type:f.type,value:parseFloat(f.value),date:f.date,cat:f.cat})
  save();state.showTransModal=false;toast('Lancamento criado!');render()
}
function deleteTrans(id){
  if(!confirm('Excluir lancamento?'))return
  state.transactions=state.transactions.filter(t=>t.id!==id);save();toast('Excluido!');render()
}

/* CLIENTS */
function searchClient(v){state.clientSearch=v;render()}
function setClientFilter(f){state.clientFilter=f;render()}
function setClientSort(s){state.clientSort=s;render()}
function viewClient(name){
  syncClients()
  state.clientDetail=name;state.subtab='clientDetail';render()
}
function goBack(){state.subtab=null;state.clientDetail=null;render()}

function openClientModal(cl){
  state.showClientModal=true
  state.editingClient=cl||null
  state.formClient=cl?{name:cl.name,phone:cl.phone||'',whatsapp:cl.whatsapp||'',birth:cl.birth||'',notes:cl.notes||'',active:cl.active!==false}:{name:'',phone:'',whatsapp:'',birth:'',notes:'',active:true}
  render()
}
function closeClientModal(e){if(e&&e.target!==e.currentTarget)return;state.showClientModal=false;state.editingClient=null;render()}
function formClient(f,v){state.formClient[f]=v}
function saveClient(){
  const f=state.formClient
  if(!f.name)return toast('Digite o nome do cliente')
  if(state.editingClient){
    state.clients=state.clients.map(c=>c.id===state.editingClient.id?{...c,name:f.name,phone:f.phone,whatsapp:f.whatsapp,birth:f.birth,notes:f.notes,active:f.active}:c)
  }else{
    if(state.clients.find(c=>c.name===f.name))return toast('Cliente ja existe')
    state.clients.push({id:Date.now(),name:f.name,phone:f.phone,whatsapp:f.whatsapp,birth:f.birth,notes:f.notes,active:f.active,createdAt:today()})
  }
  save();state.showClientModal=false;state.editingClient=null;toast('Cliente salvo!');render()
}
function editClientByName(name){
  const cl=state.clients.find(c=>c.name===name)
  openClientModal(cl||{name,phone:'',whatsapp:'',birth:'',notes:'',active:true})
}
function deleteClient(name){
  if(!confirm('Excluir cliente "'+name+'"? Os agendamentos serao mantidos.'))return
  state.clients=state.clients.filter(c=>c.name!==name);save();toast('Cliente removido');goBack();render()
}
function startBookingFromClient(name){
  state.showModal=false;state.stepModal=true;state.step=1;state.editingAppt=null
  state.formAppt={client:name,service:'',time:'09:00',date:today(),value:''}
  state.subtab=null;state.clientDetail=null;state.tab='agenda'
  render()
  setTimeout(()=>{state.step=2;render()},100)
}

function exportClientCSV(){
  syncClients()
  const rows=[['Nome','Telefone','WhatsApp','Nascimento','Visitas','Total Gasto','Ultima Visita','Observacoes']]
  state.clients.forEach(c=>{
    const info=getClientInfo(c.name)
    rows.push([c.name,c.phone||'',c.whatsapp||'',c.birth||'',info.apps.length,info.total,info.lastAppt?info.lastAppt.date:'',c.notes||''])
  })
  const csv=rows.map(r=>r.map(v=>'"'+(v||'').toString().replace(/"/g,'""')+'"').join(',')).join('\n')
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'})
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='clientes-'+today()+'.csv';a.click()
  toast('CSV exportado!')
}
function exportClientWhatsApp(){
  syncClients()
  const nums=[...new Set(state.clients.filter(c=>c.whatsapp||c.phone).map(c=>'55'+(c.whatsapp||c.phone).replace(/[^0-9]/g,'')))]
  if(!nums.length)return toast('Nenhum contato com WhatsApp')
  const text=encodeURIComponent('Oi! Passando pra avisar que temos horarios disponiveis no Martins MegaHair essa semana. Me chama pra reservar! 💇‍♀️')
  window.open('https://wa.me/?text='+text,'_blank')
  toast(nums.length+' contatos copiados para lista de transmissao')
}

/* NOTIFICATIONS */
function toggleNotif(){
  if(state.notifEnabled){
    state.notifEnabled=false;save();render();return
  }
  if(!('Notification'in window)){toast('Notificacoes nao suportadas');return}
  if(Notification.permission==='granted'){state.notifEnabled=true;save();render();toast('Notificacoes ativadas!');return}
  if(Notification.permission==='denied'){toast('Notificacoes bloqueadas no navegador');return}
  Notification.requestPermission().then(p=>{
    if(p==='granted'){state.notifEnabled=true;save();render();toast('Notificacoes ativadas!')}
    else toast('Permissao negada')
  })
}

/* DATA */
function clearData(){
  if(!confirm('Tem certeza? Todos os dados serao perdidos!'))return
  const d=[...state.services],p=[...state.pros]
  state.appointments=[];state.transactions=[]
  localStorage.removeItem('appts');localStorage.removeItem('trans');save();toast('Dados limpos!');render()
}

/* TOAST */
function toast(msg){state.toast=msg;render();setTimeout(()=>{state.toast=null;render()},2000)}

/* SW */
if('serviceWorker'in navigator){
  const swCode='self.addEventListener("install",e=>{self.skipWaiting()});self.addEventListener("fetch",e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request)))})'
  const blob=new Blob([swCode],{type:'application/javascript'})
  const url=URL.createObjectURL(blob)
  navigator.serviceWorker.register(url).catch(()=>{})
}

/* PWA Manifest */
(function(){
  const m=document.getElementById('manifest-link')
  const manifest={
    name:'Martins MegaHair',short_name:'MegaHair',start_url:'.',display:'standalone',
    background_color:'#fdf6ee',theme_color:'#fdf6ee',
    icons:[{src:'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><circle cx="24" cy="24" r="24" fill="%23c9a84c"/><text x="24" y="32" font-size="28" text-anchor="middle" fill="%231a0a14">&#9986;</text></svg>',sizes:'48x48',type:'image/svg+xml'}]
  }
  m.href='data:application/json,'+encodeURIComponent(JSON.stringify(manifest))
})()

render()
</script>

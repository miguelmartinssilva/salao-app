<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a0a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Studio Glamour</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --gold:#c9a84c;
  --gold-light:#e8c97a;
  --dark:#1a0a14;
  --dark2:#2d1020;
  --rose:#fdf8f4;
  --rose2:#fdf0e8;
  --text:#9b7060;
  --green:#7dc9a0;
  --red:#c97a7a;
  --pink:#e0a0c0;
}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--rose);color:var(--dark);overflow-x:hidden}
input,select,button,textarea{font-family:inherit;font-size:inherit}

/* HEADER */
.header{
  background:linear-gradient(160deg,var(--dark),var(--dark2));
  padding:14px 16px;display:flex;justify-content:space-between;align-items:center;
  position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.25)
}
.header-brand{display:flex;align-items:center;gap:10px}
.header-logo{
  width:34px;height:34px;border-radius:50%;
  background:linear-gradient(135deg,var(--gold),var(--gold-light));
  display:flex;align-items:center;justify-content:center;font-size:16px
}
.header-title{color:var(--gold);font-size:15px;font-weight:700;font-style:italic}
.header-btn{
  background:linear-gradient(135deg,var(--gold),var(--gold-light));
  border:none;border-radius:10px;color:var(--dark);padding:9px 14px;
  font-size:12px;font-weight:700;cursor:pointer
}

/* TAB BAR */
.tabbar{
  display:flex;background:#fff;padding:6px 4px;
  position:sticky;top:62px;z-index:99;box-shadow:0 1px 8px rgba(0,0,0,.06);
  justify-content:space-around
}
.tabbar button{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:8px 10px;border-radius:10px;border:none;cursor:pointer;
  background:transparent;color:var(--text);font-size:9px;font-weight:600;width:100%
}
.tabbar .active{background:linear-gradient(135deg,#c9a84c22,#c9a84c11);color:var(--gold)}
.tabbar svg{width:22px;height:22px}

/* MAIN */
.main{padding:14px 14px 90px}
.page-title{margin:0 0 4px;font-size:20px;color:var(--dark);font-weight:400}
.page-sub{color:var(--text);font-size:12px;margin-bottom:16px}

/* KPIS */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kpi-card{
  background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 8px rgba(180,100,120,.08);
  border-top:3px solid var(--gold)
}
.kpi-label{color:var(--text);font-size:9px;text-transform:uppercase;margin-bottom:4px;font-weight:600}
.kpi-value{font-size:20px;font-weight:700;color:var(--dark)}

/* CARDS */
.card{
  background:#fff;border-radius:12px;padding:14px;
  box-shadow:0 1px 8px rgba(180,100,120,.08);margin-bottom:12px
}
.card-title{font-size:14px;font-weight:600;color:var(--dark);margin-bottom:12px}

/* APPOINTMENT ITEM */
.appt-item{
  display:flex;align-items:center;gap:10px;padding:10px 0;
  border-bottom:1px solid var(--rose2)
}
.appt-time{width:48px;text-align:center}
.appt-time .t{font-size:14px;font-weight:700;color:var(--dark)}
.appt-info{flex:1}
.appt-info .name{font-size:13px;font-weight:600;color:var(--dark2)}
.appt-info .service{font-size:11px;color:var(--text)}
.appt-status{
  font-size:9px;padding:3px 10px;border-radius:12px;
  font-weight:700;text-transform:uppercase;border:none;cursor:pointer
}

/* CALENDAR */
.cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.cal-header button{background:none;border:none;cursor:pointer;color:var(--text);padding:4px}
.cal-header span{font-size:13px;font-weight:600}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-day-header{font-size:9px;color:var(--text);padding:4px 0;font-weight:600}
.cal-day{
  aspect-ratio:1;border-radius:50%;border:none;cursor:pointer;font-size:12px;
  background:transparent;color:var(--dark2);font-weight:400;position:relative
}
.cal-day.selected{background:linear-gradient(135deg,var(--gold),var(--gold-light));color:var(--dark);font-weight:700}
.cal-day .dot{
  position:absolute;bottom:2px;left:50%;transform:translateX(-50%);
  width:4px;height:4px;border-radius:50%;background:var(--gold)
}

/* FINANCE SUMMARY */
.fin-summary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px}
.fin-card{background:#fff;border-radius:12px;padding:12px;box-shadow:0 1px 8px rgba(180,100,120,.08)}
.fin-label{font-size:9px;color:var(--text);text-transform:uppercase;font-weight:600;margin-bottom:3px}
.fin-value{font-size:16px;font-weight:700}
.fin-green{color:var(--green)}.fin-red{color:var(--red)}.fin-gold{color:var(--gold)}

.filter-bar{display:flex;gap:6px;margin-bottom:12px}
.filter-btn{
  padding:6px 14px;border-radius:20px;border:1px solid var(--rose2);
  font-size:11px;cursor:pointer;font-weight:600
}
.filter-btn.active{background:var(--gold);color:var(--dark);border-color:var(--gold)}

.trans-item{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 0;border-bottom:1px solid var(--rose2)
}
.trans-item:last-child{border:none}
.trans-desc{font-size:12px;color:var(--dark2)}
.trans-meta{font-size:10px;color:var(--text)}
.trans-value{font-weight:700;font-size:14px}

/* CLIENT GRID */
.client-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.client-card{
  border-radius:12px;border:1px solid var(--rose2);padding:14px;background:var(--rose)
}
.client-avatar{
  width:38px;height:38px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:16px;font-weight:700;color:var(--dark);margin-bottom:8px
}
.client-name{font-size:13px;font-weight:700;color:var(--dark);margin-bottom:4px}
.client-stats{display:flex;justify-content:space-between;font-size:10px}
.client-stats span:first-child{color:var(--text)}
.client-stats span:last-child{color:var(--gold);font-weight:700}

/* SEARCH */
.search-box{position:relative;margin-bottom:12px}
.search-box input{
  width:100%;padding:10px 12px 10px 34px;border-radius:10px;
  border:1px solid var(--rose2);font-size:13px;outline:none;
  color:var(--dark2);background:var(--rose);box-sizing:border-box
}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text)}

/* BUTTON */
.btn-primary{
  width:100%;background:linear-gradient(135deg,var(--gold),var(--gold-light));
  border:none;border-radius:10px;color:var(--dark);padding:14px;
  font-size:14px;font-weight:700;cursor:pointer;margin-bottom:14px
}
.btn-secondary{
  flex:1;padding:12px;border-radius:10px;border:1px solid var(--rose2);
  background:#fff;color:var(--text);font-size:14px;cursor:pointer;font-weight:600
}
.btn-gold{
  flex:1;padding:12px;border-radius:10px;border:none;
  background:linear-gradient(135deg,var(--gold),var(--gold-light));
  color:var(--dark);font-size:14px;font-weight:700;cursor:pointer
}

/* MODAL */
.modal-overlay{
  position:fixed;inset:0;background:rgba(26,10,20,.7);display:flex;
  align-items:flex-end;z-index:200;animation:slideIn .25s ease
}
@keyframes slideIn{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-content{
  background:#fff;border-radius:20px 20px 0 0;padding:24px 20px;
  width:100%;box-shadow:0 -10px 40px rgba(26,10,20,.2)
}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal-header h3{font-size:18px;color:var(--dark);font-style:italic}
.modal-close{background:none;border:none;cursor:pointer;color:var(--text);padding:4px}
.form-group{margin-bottom:14px}
.form-group label{
  font-size:11px;color:var(--text);font-weight:600;text-transform:uppercase;
  display:block;margin-bottom:5px
}
.form-group input,.form-group select{
  width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--rose2);
  font-size:14px;outline:none;color:var(--dark2);background:var(--rose);box-sizing:border-box
}
.form-row{display:flex;gap:10px}
.form-row .form-group{flex:1}

/* TYPE TOGGLE */
.type-toggle{display:flex;gap:8px;margin-bottom:14px}
.type-btn{flex:1;padding:10px;border-radius:10px;border:2px solid var(--rose2);
  font-size:12px;font-weight:600;cursor:pointer;text-align:center}
.type-btn.active{background:var(--green);color:#fff;border-color:var(--green)}
.type-btn.red.active{background:var(--red);border-color:var(--red);color:#fff}

/* EMPTY STATE */
.empty-state{text-align:center;padding:40px 0;color:#c0a090}
.empty-state .icon{font-size:40px;margin-bottom:8px}
.empty-state .msg{font-size:13px}

/* TOAST */
.toast{
  position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
  background:var(--dark);color:#fff;padding:10px 20px;border-radius:10px;
  font-size:13px;z-index:300;animation:fadeIn .3s ease;box-shadow:0 4px 20px rgba(0,0,0,.3)
}
@keyframes fadeIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

.hidden{display:none}
.flex{display:flex}.flex-1{flex:1}.gap-8{gap:8px}
.mb-12{margin-bottom:12px}
.text-center{text-align:center}
</style>
</head>
<body>

<div id="app"></div>

<script>
const $$ = (sel, parent = document) => parent.querySelector(sel)
const $$$ = (sel, parent = document) => [...parent.querySelectorAll(sel)]

const DAYS = ['Dom','Seg','Ter','Qua','Qui','Sex','Sab']
const MONTHS = ['Janeiro','Fevereiro','Marco','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro']
const SERVICES = ['Corte','Coloracao','Hidratacao','Escova','Progressiva','Luzes','Manicure','Pedicure']
const STATUS = { confirmado: '#c9a84c', pendente: '#e0a0c0', cancelado: '#bbb', concluido: '#7dc9a0' }

// State
let state = {
  tab: 'dashboard',
  selectedDate: today(),
  appointments: JSON.parse(localStorage.getItem('appts')) || [
    { id:1,client:'Ana Paula',service:'Coloracao',time:'09:00',date:'2026-05-20',status:'confirmado',value:180 },
    { id:2,client:'Carla Mendes',service:'Escova',time:'11:30',date:'2026-05-20',status:'concluido',value:80 },
    { id:3,client:'Fernanda Lima',service:'Corte',time:'14:00',date:'2026-05-20',status:'confirmado',value:65 },
    { id:4,client:'Juliana Costa',service:'Hidratacao',time:'15:30',date:'2026-05-20',status:'pendente',value:90 },
    { id:5,client:'Mariana Silva',service:'Progressiva',time:'09:00',date:'2026-05-21',status:'confirmado',value:280 },
  ],
  transactions: JSON.parse(localStorage.getItem('trans')) || [
    { id:1,desc:'Coloracao - Ana Paula',type:'entrada',value:180,date:'2026-05-19',cat:'Servico' },
    { id:2,desc:'Tinta L\'Oreal',type:'saida',value:95,date:'2026-05-17',cat:'Material' },
    { id:3,desc:'Aluguel salao',type:'saida',value:1200,date:'2026-05-10',cat:'Fixo' },
  ],
  calMonth: 4, calYear: 2026,
  filterFin: 'todos',
  clientSearch: '',
  toast: null,
  showModal: false, editingAppt: null,
  showTransModal: false,
  formAppt: { client:'', service:SERVICES[0], time:'09:00', date:today(), value:'' },
  formTrans: { desc:'', type:'entrada', value:'', date:today(), cat:'Servico' }
}

function today() {
  const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0,10)
}

function save() {
  localStorage.setItem('appts', JSON.stringify(state.appointments))
  localStorage.setItem('trans', JSON.stringify(state.transactions))
}

function svg(path, size=18) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${path}</svg>`
}

const I = {
  dash: svg('<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',22),
  cal: svg('<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',22),
  fin: svg('<line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',22),
  cli: svg('<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',22),
  plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
  x: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
  search: '<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
  left: '<polyline points="15 18 9 12 15 6"/>',
  right: '<polyline points="9 18 15 12 9 6"/>',
  edit: '<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>',
  trash: '<polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  arrowUp: '<line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>',
  arrowDown: '<line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 5 5 12"/>',
}

/* RENDER */
function render() {
  const s = state
  const app = $$('#app')

  const todayAppts = s.appointments.filter(a => a.date === s.selectedDate).sort((a,b) => a.time.localeCompare(b.time))
  const entradas = s.transactions.filter(t => t.type === 'entrada').reduce((sum,t) => sum + t.value, 0)
  const saidas = s.transactions.filter(t => t.type === 'saida').reduce((sum,t) => sum + t.value, 0)
  const lucro = entradas - saidas
  const apptDates = new Set(s.appointments.map(a => a.date))

  const daysInMonth = new Date(s.calYear, s.calMonth + 1, 0).getDate()
  const firstDay = new Date(s.calYear, s.calMonth, 1).getDay()

  const filteredTrans = s.transactions.filter(t => s.filterFin === 'todos' || t.type === s.filterFin)

  const allClients = [...new Set(s.appointments.map(a => a.client))]
  const filteredClients = s.clientSearch ? allClients.filter(c => c.toLowerCase().includes(s.clientSearch.toLowerCase())) : allClients

  const avatarColors = ['#e0a0c0','#c9a84c','#7dc9a0','#c97a7a','#a0c0e0']

  const navItems = [
    {id:'dashboard',label:'Inicio',icon:I.dash},
    {id:'agenda',label:'Agenda',icon:I.cal},
    {id:'financeiro',label:'Financas',icon:I.fin},
    {id:'clientes',label:'Clientes',icon:I.cli},
  ]

  app.innerHTML = `
    <!-- HEADER -->
    <header class="header">
      <div class="header-brand">
        <div class="header-logo">&#9986;</div>
        <span class="header-title">Studio Glamour</span>
      </div>
      <button class="header-btn" onclick="openModal()">${svg(I.plus,14)} Novo</button>
    </header>

    <!-- TAB BAR -->
    <nav class="tabbar">
      ${navItems.map(n => `
        <button onclick="setTab('${n.id}')" class="${s.tab === n.id ? 'active' : ''}">
          ${n.icon}
          ${n.label}
        </button>
      `).join('')}
    </nav>

    <!-- MAIN -->
    <main class="main">
      <div class="page-title">
        ${s.tab === 'dashboard' ? 'Visao Geral' :
          s.tab === 'agenda' ? 'Agenda' :
          s.tab === 'financeiro' ? 'Financeiro' : 'Clientes'}
      </div>

      ${s.tab === 'dashboard' ? renderDashboard(entradas, saidas, lucro, todayAppts) :
        s.tab === 'agenda' ? renderAgenda(s, firstDay, daysInMonth, apptDates, todayAppts) :
        s.tab === 'financeiro' ? renderFinanceiro(entradas, saidas, lucro, filteredTrans, s.filterFin) :
        renderClientes(s.clientSearch, filteredClients, s.appointments, avatarColors)}

    </main>

    <!-- TOAST -->
    ${s.toast ? `<div class="toast">${s.toast}</div>` : ''}

    <!-- MODALS -->
    ${s.showModal ? renderApptModal(s) : ''}
    ${s.showTransModal ? renderTransModal(s) : ''}
  `
}

function renderDashboard(entradas, saidas, lucro, todayAppts) {
  const ticket = Math.round(entradas / (state.transactions.filter(t=>t.type==='entrada').length || 1))
  const margem = entradas ? Math.round(lucro/entradas*100) : 0

  return `
    <div class="kpis">
      <div class="kpi-card" style="border-color:var(--gold)">
        <div class="kpi-label">Receita do mes</div>
        <div class="kpi-value">R$ ${entradas.toLocaleString('pt-BR')}</div>
      </div>
      <div class="kpi-card" style="border-color:var(--pink)">
        <div class="kpi-label">Agendamentos</div>
        <div class="kpi-value">${state.appointments.length}</div>
      </div>
      <div class="kpi-card" style="border-color:var(--green)">
        <div class="kpi-label">Ticket medio</div>
        <div class="kpi-value">R$ ${ticket}</div>
      </div>
      <div class="kpi-card" style="border-color:var(--red)">
        <div class="kpi-label">Despesas</div>
        <div class="kpi-value">R$ ${saidas.toLocaleString('pt-BR')}</div>
      </div>
    </div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div class="card-title" style="margin:0">Hoje — ${todayAppts.length} agendamentos</div>
      </div>
      ${todayAppts.length === 0 ? `
        <div class="empty-state"><div class="icon">&#9986;</div><div class="msg">Nenhum agendamento hoje</div></div>
      ` : todayAppts.map(a => `
        <div class="appt-item">
          <div class="appt-time"><div class="t">${a.time}</div></div>
          <div class="appt-info">
            <div class="name">${a.client}</div>
            <div class="service">${a.service}</div>
          </div>
          <select class="appt-status" style="background:${STATUS[a.status]}33;color:${STATUS[a.status]}" onchange="updateStatus(${a.id},this.value)">
            <option value="pendente" ${a.status==='pendente'?'selected':''}>Pendente</option>
            <option value="confirmado" ${a.status==='confirmado'?'selected':''}>Confirmado</option>
            <option value="concluido" ${a.status==='concluido'?'selected':''}>Concluido</option>
            <option value="cancelado" ${a.status==='cancelado'?'selected':''}>Cancelado</option>
          </select>
        </div>
      `).join('')}
    </div>

    <div class="card">
      <div class="card-title">Resumo Financeiro</div>
      <div style="display:flex;justify-content:space-between;padding:8px 0;font-size:13px">
        <span style="color:var(--text)">Entradas</span>
        <span style="font-weight:700;color:var(--green)">R$ ${entradas.toLocaleString('pt-BR')}</span>
      </div>
      <div style="display:flex;justify-content:space-between;padding:8px 0;font-size:13px">
        <span style="color:var(--text)">Saidas</span>
        <span style="font-weight:700;color:var(--red)">R$ ${saidas.toLocaleString('pt-BR')}</span>
      </div>
      <div style="display:flex;justify-content:space-between;padding:8px 0;font-size:13px">
        <span style="color:var(--text)">Lucro</span>
        <span style="font-weight:700;color:var(--gold)">R$ ${lucro.toLocaleString('pt-BR')}</span>
      </div>
      <div style="background:var(--rose2);border-radius:8px;padding:10px;margin-top:8px">
        <div style="font-size:10px;color:var(--text);margin-bottom:4px">Margem de lucro: ${margem}%</div>
        <div style="height:6px;background:#e8dcd4;border-radius:8px;overflow:hidden">
          <div style="height:100%;width:${margem}%;background:linear-gradient(90deg,var(--gold),var(--gold-light));border-radius:8px"></div>
        </div>
      </div>
    </div>
  `
}

function renderAgenda(s, firstDay, daysInMonth, apptDates, todayAppts) {
  return `
    <div class="card">
      <div class="cal-header">
        <button onclick="prevMonth()">${svg(I.left,16)}</button>
        <span>${MONTHS[s.calMonth]} ${s.calYear}</span>
        <button onclick="nextMonth()">${svg(I.right,16)}</button>
      </div>
      <div class="cal-grid">
        ${DAYS.map(d => `<div class="cal-day-header">${d}</div>`).join('')}
        ${Array(firstDay).fill().map((_,i) => `<div></div>`).join('')}
        ${Array(daysInMonth).fill().map((_,i) => {
          const day = i + 1
          const ds = `${s.calYear}-${String(s.calMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`
          const sel = ds === s.selectedDate
          const has = apptDates.has(ds)
          return `<button class="cal-day${sel?' selected':''}" onclick="selectDate('${ds}')">${day}${has && !sel ? '<span class="dot"></span>':''}</button>`
        }).join('')}
      </div>
    </div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div class="card-title" style="margin:0">
          ${s.selectedDate === today() ? 'Hoje' : s.selectedDate.split('-').reverse().join('/')} — ${todayAppts.length}
        </div>
      </div>
      ${todayAppts.length === 0 ? `
        <div class="empty-state"><div class="icon">&#9986;</div><div class="msg">Nenhum agendamento</div></div>
      ` : todayAppts.map(a => `
        <div class="appt-item">
          <div class="appt-time"><div class="t">${a.time}</div></div>
          <div class="appt-info">
            <div class="name">${a.client}</div>
            <div class="service">${a.service} - R$ ${a.value}</div>
          </div>
          <div style="display:flex;gap:4px">
            <button onclick="editAppt(${a.id})" style="background:none;border:none;cursor:pointer;color:var(--text);padding:4px">${svg(I.edit,14)}</button>
            <button onclick="deleteAppt(${a.id})" style="background:none;border:none;cursor:pointer;color:var(--red);padding:4px">${svg(I.trash,14)}</button>
          </div>
        </div>
      `).join('')}
    </div>
  `
}

function renderFinanceiro(entradas, saidas, lucro, filteredTrans, filterFin) {
  return `
    <div class="fin-summary">
      <div class="fin-card">
        <div class="fin-label">Entradas</div>
        <div class="fin-value fin-green">R$ ${entradas.toLocaleString('pt-BR')}</div>
      </div>
      <div class="fin-card">
        <div class="fin-label">Saidas</div>
        <div class="fin-value fin-red">R$ ${saidas.toLocaleString('pt-BR')}</div>
      </div>
      <div class="fin-card">
        <div class="fin-label">Lucro</div>
        <div class="fin-value fin-gold">R$ ${lucro.toLocaleString('pt-BR')}</div>
      </div>
    </div>

    <button class="btn-primary" onclick="openTransModal()">${svg(I.plus,14)} Novo Lancamento</button>

    <div class="card">
      <div class="filter-bar">
        <button class="filter-btn${filterFin==='todos'?' active':''}" onclick="setFilter('todos')">Todos</button>
        <button class="filter-btn${filterFin==='entrada'?' active':''}" onclick="setFilter('entrada')">Entradas</button>
        <button class="filter-btn${filterFin==='saida'?' active':''}" onclick="setFilter('saida')">Saidas</button>
      </div>
      ${filteredTrans.length === 0 ? `
        <div class="empty-state"><div class="icon">&#128176;</div><div class="msg">Nenhum lancamento</div></div>
      ` : filteredTrans.map(t => `
        <div class="trans-item">
          <div>
            <div class="trans-desc">${t.desc}</div>
            <div class="trans-meta">${t.date.split('-').reverse().join('/')} • ${t.cat}</div>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <span class="trans-value" style="color:${t.type==='entrada'?'var(--green)':'var(--red)'}">
              ${t.type==='entrada'?'+':'-'} R$ ${t.value.toLocaleString('pt-BR')}
            </span>
            <button onclick="deleteTrans(${t.id})" style="background:none;border:none;cursor:pointer;color:var(--red)">${svg(I.trash,12)}</button>
          </div>
        </div>
      `).join('')}
    </div>
  `
}

function renderClientes(search, clients, appts, colors) {
  return `
    <div class="card">
      <div class="search-box">
        <span class="search-icon">${svg(I.search,14)}</span>
        <input placeholder="Buscar cliente..." value="${search}" oninput="searchClient(this.value)">
      </div>
    </div>

    ${clients.length === 0 ? `
      <div style="background:#fff;border-radius:12px;padding:30px;text-align:center;color:#c0a090">
        <div style="font-size:30px;margin-bottom:8px">&#128101;</div>
        <div style="font-size:13px">Nenhum cliente encontrado</div>
      </div>
    ` : `
    <div class="client-grid">
      ${clients.map((c,i) => {
        const appts = state.appointments.filter(a => a.client === c)
        const total = appts.reduce((s,a) => s + a.value, 0)
        return `
          <div class="client-card">
            <div class="client-avatar" style="background:${colors[i%5]}44;border:1px solid ${colors[i%5]}66">
              ${c.charAt(0)}
            </div>
            <div class="client-name">${c}</div>
            <div class="client-stats">
              <span>${appts.length} visita${appts.length!==1?'s':''}</span>
              <span>R$ ${total}</span>
            </div>
          </div>
        `
      }).join('')}
    </div>
    `}
  `
}

function renderApptModal(s) {
  const isEdit = s.editingAppt
  return `
    <div class="modal-overlay" onclick="closeModal(event)">
      <div class="modal-content" onclick="e=>e.stopPropagation()">
        <div class="modal-header">
          <h3>${isEdit ? 'Editar' : 'Novo'} Agendamento</h3>
          <button class="modal-close" onclick="closeModal()">${svg(I.x,18)}</button>
        </div>
        <div class="form-group">
          <label>Cliente</label>
          <input placeholder="Nome da cliente" value="${s.formAppt.client}" oninput="formAppt('client',this.value)">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Data</label>
            <input type="date" value="${s.formAppt.date}" oninput="formAppt('date',this.value)">
          </div>
          <div class="form-group">
            <label>Horario</label>
            <input type="time" value="${s.formAppt.time}" oninput="formAppt('time',this.value)">
          </div>
        </div>
        <div class="form-group">
          <label>Servico</label>
          <select onchange="formAppt('service',this.value)">
            ${SERVICES.map(sv => `<option value="${sv}" ${s.formAppt.service===sv?'selected':''}>${sv}</option>`).join('')}
          </select>
        </div>
        <div class="form-group">
          <label>Valor (R$)</label>
          <input type="number" placeholder="0" value="${s.formAppt.value}" oninput="formAppt('value',this.value)">
        </div>
        <div style="display:flex;gap:10px">
          <button class="btn-secondary" onclick="closeModal()">Cancelar</button>
          <button class="btn-gold" onclick="${isEdit ? 'saveEditAppt()' : 'saveAppt()'}">${isEdit ? 'Salvar' : 'Agendar'}</button>
        </div>
      </div>
    </div>
  `
}

function renderTransModal(s) {
  return `
    <div class="modal-overlay" onclick="closeTransModal(event)">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Novo Lancamento</h3>
          <button class="modal-close" onclick="closeTransModal()">${svg(I.x,18)}</button>
        </div>
        <div class="type-toggle">
          <div class="type-btn${s.formTrans.type==='entrada'?' active':''}" onclick="formTrans('type','entrada')">Entrada</div>
          <div class="type-btn red${s.formTrans.type==='saida'?' active':''}" onclick="formTrans('type','saida')">Saida</div>
        </div>
        <div class="form-group">
          <label>Descricao</label>
          <input placeholder="Ex: Corte - Maria" value="${s.formTrans.desc}" oninput="formTrans('desc',this.value)">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Valor (R$)</label>
            <input type="number" placeholder="0" value="${s.formTrans.value}" oninput="formTrans('value',this.value)">
          </div>
          <div class="form-group">
            <label>Data</label>
            <input type="date" value="${s.formTrans.date}" oninput="formTrans('date',this.value)">
          </div>
        </div>
        <div class="form-group">
          <label>Categoria</label>
          <select onchange="formTrans('cat',this.value)">
            <option value="Servico" ${s.formTrans.cat==='Servico'?'selected':''}>Servico</option>
            <option value="Material" ${s.formTrans.cat==='Material'?'selected':''}>Material</option>
            <option value="Fixo" ${s.formTrans.cat==='Fixo'?'selected':''}>Fixo</option>
            <option value="Outros" ${s.formTrans.cat==='Outros'?'selected':''}>Outros</option>
          </select>
        </div>
        <div style="display:flex;gap:10px">
          <button class="btn-secondary" onclick="closeTransModal()">Cancelar</button>
          <button class="btn-gold" onclick="saveTrans()">Salvar</button>
        </div>
      </div>
    </div>
  `
}

/* ACTIONS */
function setTab(tab) { state.tab = tab; render() }

function selectDate(d) { state.selectedDate = d; render() }

function prevMonth() {
  if (state.calMonth === 0) { state.calMonth = 11; state.calYear-- }
  else state.calMonth--
  render()
}
function nextMonth() {
  if (state.calMonth === 11) { state.calMonth = 0; state.calYear++ }
  else state.calMonth++
  render()
}

function openModal() { state.showModal = true; state.editingAppt = null; state.formAppt = { client:'', service:SERVICES[0], time:'09:00', date:state.selectedDate, value:'' }; render() }
function closeModal(e) { if (e && e.target !== e.currentTarget) return; state.showModal = false; render() }
function formAppt(field,val) { state.formAppt[field] = val }

function saveAppt() {
  const f = state.formAppt
  if (!f.client || !f.value) return toast('Preencha todos os campos')
  state.appointments.push({
    id: Date.now(), client: f.client, service: f.service,
    time: f.time, date: f.date, status: 'pendente', value: parseFloat(f.value)
  })
  save(); state.showModal = false; toast('Agendamento criado!'); render()
}

function editAppt(id) {
  const a = state.appointments.find(x => x.id === id)
  if (!a) return
  state.editingAppt = a
  state.formAppt = { client: a.client, service: a.service, time: a.time, date: a.date, value: a.value.toString() }
  state.showModal = true; render()
}

function saveEditAppt() {
  const f = state.formAppt; const e = state.editingAppt
  if (!f.client || !f.value) return toast('Preencha todos os campos')
  state.appointments = state.appointments.map(a => a.id === e.id ? { ...a, ...f, value: parseFloat(f.value) } : a)
  save(); state.showModal = false; state.editingAppt = null; toast('Atualizado!'); render()
}

function deleteAppt(id) {
  if (!confirm('Excluir agendamento?')) return
  state.appointments = state.appointments.filter(a => a.id !== id)
  save(); toast('Excluido!'); render()
}

function updateStatus(id, status) {
  state.appointments = state.appointments.map(a => a.id === id ? { ...a, status } : a)
  save(); render()
}

/* FINANCE */
function setFilter(f) { state.filterFin = f; render() }
function openTransModal() { state.showTransModal = true; state.formTrans = { desc:'', type:'entrada', value:'', date:today(), cat:'Servico' }; render() }
function closeTransModal(e) { if (e && e.target !== e.currentTarget) return; state.showTransModal = false; render() }
function formTrans(field,val) { state.formTrans[field] = val; render() }

function saveTrans() {
  const f = state.formTrans
  if (!f.desc || !f.value) return toast('Preencha todos os campos')
  state.transactions.push({ id: Date.now(), desc: f.desc, type: f.type, value: parseFloat(f.value), date: f.date, cat: f.cat })
  save(); state.showTransModal = false; toast('Lancamento criado!'); render()
}

function deleteTrans(id) {
  if (!confirm('Excluir lancamento?')) return
  state.transactions = state.transactions.filter(t => t.id !== id)
  save(); toast('Excluido!'); render()
}

/* CLIENTS */
function searchClient(val) { state.clientSearch = val; render() }

/* TOAST */
function toast(msg) {
  state.toast = msg; render()
  setTimeout(() => { state.toast = null; render() }, 2000)
}

render()
</script>
</body>
</html>
